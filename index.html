<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORLD WAR SUPREMACY: FINAL SUPREMACY</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0c; --panel: #16161a; --border: #2a2a30; --text: #e0e0e6; --accent: #4f46e5;
            --ni: #8b0000; --de: #00008b; --uk: #006400; --fr: #b8860b; --ca: #4b0082;
            --danger: #e74c3c; --gold: #f1c40f; --silver: #bdc3c7; --bronze: #cd7f32;
            --success: #2ecc71;
        }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        @media (min-width: 900px) {
            body { flex-direction: row; }
            #sidebar { width: 340px; height: 100vh; position: sticky; top: 0; overflow-y: auto; border-right: 1px solid var(--border); }
            #main { flex: 1; padding: 20px; }
        }
        @media (max-width: 899px) {
            #sidebar { width: 100%; border-bottom: 1px solid var(--border); padding: 10px; box-sizing: border-box; }
            #main { width: 100%; padding: 10px; box-sizing: border-box; }
        }

        #lobby, #result-overlay, #alliance-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .box { background: var(--panel); padding: 30px; border-radius: 12px; border: 1px solid var(--border); width: 90%; max-width: 420px; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.5); }

        input { background: #000; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        button { width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; background: var(--accent); color: white; margin-bottom: 4px; font-size: 13px; }
        button:hover:not(:disabled) { filter: brightness(1.2); }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        #grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; width: 100%; max-width: 900px; margin: 0 auto; aspect-ratio: 9/6; }
        .cell { aspect-ratio: 1; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: clamp(9px, 2vw, 14px); font-weight: bold; cursor: pointer; transition: 0.1s; position: relative; border: 1px solid rgba(255,255,255,0.05); }
        .cell:hover { border-color: #fff; z-index: 5; transform: scale(1.02); }
        .cell.selected { border: 2px solid #fff; box-shadow: 0 0 15px var(--accent); z-index: 10; }
        .ally-mark { position: absolute; top: 1px; right: 1px; font-size: 12px; }

        .info-card { background: var(--panel); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border); }
        .log-box { height: 160px; overflow-y: auto; font-size: 11px; background: #000; padding: 10px; border-radius: 6px; border: 1px solid var(--border); display: flex; flex-direction: column; }
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        
        .score-row { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; border-bottom: 1px solid #222; }
        .flex-row { display: flex; gap: 5px; align-items: center; margin-bottom: 5px; }
        .flex-row input { margin-bottom: 0; text-align: center; font-size: 12px; }
        .current-turn-glow { animation: glow 1.5s infinite alternate; }
        @keyframes glow { from { box-shadow: 0 0 2px #fff; } to { box-shadow: 0 0 15px var(--accent); } }

        .rank-item { padding: 15px; margin: 10px 0; border-radius: 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .rank-1 { background: linear-gradient(45deg, #d4af37, #f1c40f); color: #000; font-size: 1.2rem; }
        .rank-2 { background: var(--silver); color: #000; }
        .rank-3 { background: var(--bronze); color: #000; }
        #alliance-timer { font-size: 2rem; color: var(--danger); font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>

    <!-- ロビー -->
    <div id="lobby">
        <div class="box">
            <h2 style="margin:0; letter-spacing: 2px;">WORLD WAR SUPREMACY</h2>
            <div id="lobby-setup">
                <input type="text" id="room-id" placeholder="部屋名を入力">
                <button onclick="hostRoom()">部屋を作る</button>
                <button onclick="joinRoom()" style="background:#333">参加する</button>
            </div>
            <div id="lobby-wait" style="display:none">
                <p id="room-display" style="color:var(--accent); font-weight:bold;"></p>
                <div id="player-list" style="text-align:left; font-size:13px; margin-bottom:15px"></div>
                <button id="start-btn" onclick="game.start()" style="display:none; background:var(--success)">ゲーム開始 (AI補充)</button>
                <small id="wait-msg">接続待機中...</small>
            </div>
        </div>
    </div>

    <!-- リザルト画面 -->
    <div id="result-overlay" style="display:none">
        <div class="box">
            <h1 style="color:var(--gold); margin-top:0;">最終結果発表</h1>
            <div id="ranking-list"></div>
            <button onclick="game.resetToHome()" style="margin-top:20px; background:var(--danger); height:50px;">ホームに戻る</button>
        </div>
    </div>

    <!-- 同盟承認モーダル -->
    <div id="alliance-modal" style="display:none">
        <div class="box">
            <h2 id="alliance-request-text">申請が届きました</h2>
            <div id="alliance-timer">10</div>
            <div style="display:flex; gap:10px;">
                <button onclick="game.answerAlliance(true)" style="background:var(--success); flex:1;">承認</button>
                <button onclick="game.answerAlliance(false)" style="background:var(--danger); flex:1;">拒否</button>
            </div>
        </div>
    </div>

    <!-- サイドバーUI -->
    <div id="sidebar">
        <div class="info-card">
            <h3 id="turn-display" style="color:var(--accent); margin:0">準備中</h3>
            <p id="my-info" style="font-size:13px; margin:5px 0 0; opacity:0.7"></p>
        </div>

        <div class="info-card">
            <div style="font-size: 11px; font-weight: bold; margin-bottom: 5px;">勝利スコア (2勝先取)</div>
            <div id="score-board"></div>
        </div>

        <div class="info-card" id="detail-panel">
            <div id="det-name" style="font-size: 1.0rem; font-weight: bold; color: var(--accent);">国を選択</div>
            <div id="det-stats" style="font-size: 13px; margin-top: 8px; line-height: 1.5;">
                所有者: <span id="det-owner">-</span><br>
                総戦力: <span id="det-power" style="color:#ff7675">-</span><br>
                総資金: <span id="det-cash" style="color:#ffeaa7">-</span>
            </div>
        </div>

        <div class="info-card" id="actions" style="display:none">
            <div class="flex-row">
                <span style="font-size:11px;">設定量:</span>
                <input type="number" id="act-amount" value="20" min="10" step="10">
            </div>
            <div class="action-grid" id="normal-actions">
                <button onclick="game.handleActionRequest('war')">戦争(総力戦)</button>
                <button onclick="game.handleActionRequest('tax')" id="tax-btn">徴税</button>
                <button onclick="game.handleActionRequest('plus')">軍拡(+N)</button>
                <button onclick="game.handleActionRequest('minus')">軍縮(-N)</button>
                <button onclick="game.handleActionRequest('plus_max')" style="background:var(--success)">軍拡(最大)</button>
                <button onclick="game.handleActionRequest('minus_max')" style="background:#e67e22">軍縮(最大)</button>
                <button onclick="game.handleActionRequest('alliance')">同盟申請</button>
                <button onclick="game.handleActionRequest('requestAid')">援助要請</button>
                <button onclick="game.handleActionRequest('break_alliance')" style="grid-column: span 2; background: var(--danger)">同盟を破棄する</button>
                <button onclick="game.handleActionRequest('end')" style="grid-column: span 2; background:#333">ターン終了</button>
            </div>
            <div id="host-round-actions" style="display:none; margin-top:10px;">
                <button onclick="game.nextRound()" style="background:#4f46e5; height:50px;">次のラウンドへ</button>
            </div>
        </div>

        <div class="info-card">
            <div class="log-box" id="game-log"></div>
        </div>
    </div>

    <div id="main">
        <div id="grid"></div>
    </div>

<script>
    const MAJORS = [
        { id: 'ni', name: '日本', short: '日本', color: '#8b0000', power: 10, cash: 30 },
        { id: 'de', name: 'ドイツ', short: 'ドイ', color: '#00008b', power: 10, cash: 30 },
        { id: 'uk', name: 'イギリス', short: 'イギ', color: '#006400', power: 10, cash: 30 },
        { id: 'fr', name: 'フランス', short: 'フラ', color: '#b8860b', power: 10, cash: 30 },
        { id: 'ca', name: 'カナダ', short: 'カナ', color: '#4b0082', power: 10, cash: 30 }
    ];
    // 修正：大国ステータス変更 (300/900)
    const SUPERS = [
        { id: 'us', name: 'アメリカ', short: 'アメ', color: '#000', power: 300, cash: 900 },
        { id: 'ru', name: 'ロシア', short: 'ロシ', color: '#000', power: 300, cash: 900 },
        { id: 'cn', name: '中国', short: '中国', color: '#000', power: 300, cash: 900 },
        { id: 'in', name: 'インド', short: 'イン', color: '#000', power: 300, cash: 900 }
    ];
    const MIDDLE_COUNTRIES = ["インド", "韓国", "イタリア", "オーストラリア", "ブラジル", "インドネシア", "トルコ", "サウジアラビア", "メキシコ", "南アフリカ", "スペイン", "ポーランド", "オランダ", "イラン", "アルゼンチン"];
    const SMALL_NAMES = ["ルクセンブルク", "アイスランド", "エストニア", "ラトビア", "リトアニア", "スロバキア", "キプロス", "マルタ", "シンガポール", "ブルネイ", "ブータン", "モルティブ", "ラオス", "東ティモール", "フィジー", "サモア", "カタール", "バーレーン", "オマーン", "ボツワナ", "モーリシャス", "カーボベルデ", "セイシェル", "ジブチ", "ナミビア", "ウルグアイ", "コスタリカ", "ジャマイカ", "バルバドス", "バハマ"];

    class GameCore {
        constructor() {
            this.state = null; this.resetData();
            this.peer = null; this.conns = {}; this.myPeerId = null; this.isHost = false; this.selectedIdx = null; this.hostId = null;
            this.allianceInterval = null;
        }

        resetData() {
            this.state = { 
                grid: [], turnIdx: 0, players: {}, taxUsed: {}, alliances: [], isStarted: false, winner: null, 
                scores: { ni: 0, de: 0, uk: 0, fr: 0, ca: 0 }, 
                maxLands: { ni: 0, de: 0, uk: 0, fr: 0, ca: 0 }, // 最大領土数記録
                warCooldown: { ni: 0, de: 0, uk: 0, fr: 0, ca: 0 }, // AI戦争クールダウン
                round: 1, finalWinner: null, logs: [] 
            };
        }

        initMap() {
            const middle = MIDDLE_COUNTRIES.map((n, i) => ({ id: `m${i}`, name: n, short: n.slice(0, 2), color: '#333', power: 50, cash: 150 }));
            const small = SMALL_NAMES.map((n, i) => ({ id: `s${i}`, name: n, short: n.slice(0, 2), color: '#666', power: 10, cash: 30 }));
            const all = [...MAJORS, ...SUPERS, ...middle, ...small];
            const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } };
            do { shuffle(all); } while (!this.checkMap(all));
            this.state.grid = all.map((c, i) => ({ ...c, ownerId: c.id, pos: i, power: c.power, cash: c.cash }));
            MAJORS.forEach(m => {
                this.state.taxUsed[m.id] = 0;
                this.state.warCooldown[m.id] = 0;
            });
            this.state.alliances = []; this.state.winner = null; this.state.turnIdx = 0; this.selectedIdx = null;
        }

        checkMap(list) {
            const isP = (c) => MAJORS.concat(SUPERS).some(m => m.id === c.id);
            for (let i = 0; i < list.length; i++) {
                if (!isP(list[i])) continue;
                const x = i % 9, y = Math.floor(i / 9);
                for (let [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
                    const nx = x+dx, ny = y+dy;
                    if (nx>=0 && nx<9 && ny>=0 && ny<6 && isP(list[ny * 9 + nx])) return false;
                }
            }
            return true;
        }

        start() { if (this.isHost) { this.initMap(); this.state.isStarted = true; this.addLog(`【対戦開始】日本の手番から。`); this.broadcast(); } }
        nextRound() { if (this.isHost) { this.state.round++; this.initMap(); this.addLog(`【第 ${this.state.round} ラウンド】開始。`); this.broadcast(); } }

        broadcast() {
            if (!this.isHost || !this.state.isStarted) return;
            // 放送前に最大領土数をリアルタイム更新
            MAJORS.forEach(m => {
                const count = this.state.grid.filter(c => c.ownerId === m.id).length;
                if (count > this.state.maxLands[m.id]) this.state.maxLands[m.id] = count;
            });
            Object.values(this.conns).forEach(c => c.send({ type: 'sync', state: this.state }));
            this.updateUI();
        }

        addLog(msg) {
            if (!this.isHost) return;
            this.state.logs.push(msg);
            if (this.state.logs.length > 40) this.state.logs.shift();
        }

        handleActionRequest(type) {
            if (!this.canIMove()) return;
            const myId = this.state.players[this.myPeerId];
            const amount = parseInt(document.getElementById('act-amount').value) || 20;
            if (this.isHost) this.applyAction(myId, type, this.selectedIdx, amount);
            else this.conns[this.hostId].send({ type: 'action', actorId: myId, actType: type, targetIdx: this.selectedIdx, amount });
        }

        getMajorBaseCell(majorId) { return this.state.grid.find(c => c.id === majorId); }

        applyAction(actorId, type, targetIdx, amount) {
            if (!this.isHost || this.state.winner) return;
            const actorBase = this.getMajorBaseCell(actorId);
            const myCells = this.state.grid.filter(c => c.ownerId === actorId);
            let logMsg = "";

            switch(type) {
                case 'war':
                    if (targetIdx === null) break;
                    const targetCell = this.state.grid[targetIdx];
                    if (targetCell.ownerId === actorId || this.isAlly(actorId, targetCell.ownerId)) { logMsg = "攻撃不可能です。"; break; }
                    const isAdj = myCells.some(mc => Math.abs((mc.pos % 9)-(targetCell.pos % 9)) + Math.abs(Math.floor(mc.pos / 9)-Math.floor(targetCell.pos / 9)) === 1);
                    if (!isAdj) break;

                    const targetOwnerId = targetCell.ownerId;
                    const isMajorTarget = MAJORS.some(m => m.id === targetOwnerId);
                    
                    // 総力戦判定
                    const enemyPower = isMajorTarget ? this.getMajorBaseCell(targetOwnerId).power : targetCell.power;

                    if (actorBase.power > enemyPower) {
                        actorBase.power -= enemyPower;
                        const enemyBase = isMajorTarget ? this.getMajorBaseCell(targetOwnerId) : targetCell;
                        const enemyCash = enemyBase.cash;
                        actorBase.cash += enemyCash;

                        if (isMajorTarget) {
                            logMsg = `⚠️ ${actorBase.name}が${enemyBase.name}を滅亡させ全土併合！`;
                            // 修正：すべての相手領土を自分のものにする
                            this.state.grid.forEach(c => { if(c.ownerId === targetOwnerId) c.ownerId = actorId; });
                            enemyBase.power = 0; enemyBase.cash = 0;
                        } else {
                            logMsg = `${actorBase.name}が${targetCell.name}を制圧。`;
                            targetCell.ownerId = actorId;
                        }
                        
                        // AIの場合はクールダウンをセット (1戦につき3ターン休み)
                        if (!Object.values(this.state.players).includes(actorId)) {
                            this.state.warCooldown[actorId] = 3;
                        }
                        this.checkRoundVictory();
                    } else { logMsg = `${actorBase.name}の侵攻は失敗。`; }
                    break;

                case 'tax':
                    if (this.state.taxUsed[actorId] < 5) {
                        const gain = myCells.length * 20; actorBase.cash += gain; this.state.taxUsed[actorId]++;
                        logMsg = `${actorBase.name}が徴税(+${gain})`;
                    } break;
                case 'plus': if (actorBase.cash >= amount * 2) { actorBase.cash -= amount * 2; actorBase.power += amount; logMsg = `${actorBase.name}が軍拡。`; } break;
                case 'plus_max':
                    const maxP = Math.floor(actorBase.cash / 2);
                    if (maxP > 0) { actorBase.cash -= maxP * 2; actorBase.power += maxP; logMsg = `${actorBase.name}が限界軍拡。`; }
                    break;
                case 'minus_max': if (actorBase.power > 0) { actorBase.cash += actorBase.power * 2; actorBase.power = 0; logMsg = `${actorBase.name}が全戦力換金。`; } break;
                
                case 'alliance':
                    if (targetIdx === null) break;
                    const tid = this.state.grid[targetIdx].ownerId;
                    if (MAJORS.some(m => m.id === tid) && tid !== actorId) {
                        const targetPeer = Object.keys(this.state.players).find(key => this.state.players[key] === tid);
                        if (targetPeer && targetPeer !== this.myPeerId) {
                            this.conns[targetPeer].send({ type: 'alliance_request', fromId: actorId });
                            this.addLog(`${actorBase.name}が${MAJORS.find(m=>m.id===tid).name}に同盟を打診中...`);
                            this.broadcast(); return; 
                        } else {
                            this.state.alliances.push([actorId, tid]);
                            logMsg = `🤝 ${actorBase.name}と${MAJORS.find(m=>m.id===tid).name}が同盟。`;
                        }
                    } break;

                case 'alliance_ok':
                    this.state.alliances.push([actorId, targetIdx]);
                    this.addLog(`🤝 ${actorBase.name}と${MAJORS.find(m=>m.id===targetIdx).name}が同盟締結！`);
                    this.nextTurn(); return;
                case 'alliance_ng': this.addLog(`💔 同盟申請は拒否。`); this.nextTurn(); return;

                case 'break_alliance':
                    if (targetIdx === null) break;
                    const b_tid = this.state.grid[targetIdx].ownerId;
                    if (this.isAlly(actorId, b_tid)) {
                        this.state.alliances = this.state.alliances.filter(p => !(p.includes(actorId) && p.includes(b_tid)));
                        logMsg = `⚠️ ${actorBase.name}が同盟を一方的に破棄！`;
                    } break;
                case 'requestAid':
                    if (targetIdx === null) break;
                    const aidPid = this.state.grid[targetIdx].ownerId;
                    if (this.isAlly(actorId, aidPid)) {
                        const pb = this.getMajorBaseCell(aidPid);
                        if (pb.cash >= 20) { pb.cash -= 20; actorBase.cash += 20; pb.power -= 5; actorBase.power += 5; logMsg = `${actorBase.name}が援助を受けた。`; }
                    } break;
                case 'end': logMsg = `${actorBase.name}が待機。`; break;
            }
            if (logMsg) this.addLog(logMsg);
            this.nextTurn();
        }

        answerAlliance(agreed) {
            document.getElementById('alliance-modal').style.display = 'none';
            clearInterval(this.allianceInterval);
            const req = this.pendingRequest;
            if (this.isHost) this.applyAction(req.fromId, agreed ? 'alliance_ok' : 'alliance_ng', this.state.players[this.myPeerId], 0);
            else this.conns[this.hostId].send({ type: 'alliance_answer', fromId: req.fromId, toId: this.state.players[this.myPeerId], agreed: agreed });
        }

        nextTurn() {
            if (!this.isHost) return;
            if (this.state.winner) { this.broadcast(); return; }
            this.state.turnIdx = (this.state.turnIdx + 1) % 5;
            const nextId = MAJORS[this.state.turnIdx].id;
            if (!this.state.grid.some(c => c.ownerId === nextId)) return this.nextTurn();
            this.broadcast();
            const isHuman = Object.values(this.state.players).includes(nextId);
            if (!isHuman && !this.state.winner) setTimeout(() => this.runAI(nextId), 600);
        }

        runAI(id) {
            const actorBase = this.getMajorBaseCell(id);
            const myCells = this.state.grid.filter(c => c.ownerId === id);

            // クールダウンチェック (戦争制限)
            if (this.state.warCooldown[id] > 0) {
                this.state.warCooldown[id]--;
            } else {
                let bestT = null; let minP = Infinity; let hasEnemy = false;
                myCells.forEach(mc => {
                    const x = mc.pos % 9, y = Math.floor(mc.pos / 9);
                    [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx, dy]) => {
                        const nx = x+dx, ny = y+dy;
                        if(nx>=0 && nx<9 && ny>=0 && ny<6) {
                            const t = this.state.grid[ny*9+nx];
                            if(t.ownerId !== id && !this.isAlly(id, t.ownerId)) {
                                hasEnemy = true;
                                const isM = MAJORS.some(m => m.id === t.ownerId);
                                const p = isM ? this.getMajorBaseCell(t.ownerId).power : t.power;
                                if (actorBase.power > p && p < minP) { minP = p; bestT = ny*9+nx; }
                            }
                        }
                    });
                });
                if (bestT !== null) return this.applyAction(id, 'war', bestT, 0);

                // 裏切り判定 (敵がいなくなった場合など)
                if (!hasEnemy) {
                    let weakAlly = null;
                    myCells.forEach(mc => {
                        const x = mc.pos % 9, y = Math.floor(mc.pos / 9);
                        [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx, dy]) => {
                            const nx = x+dx, ny = y+dy;
                            if(nx>=0 && nx<9 && ny>=0 && ny<6) {
                                const t = this.state.grid[ny*9+nx];
                                if(this.isAlly(id, t.ownerId)) {
                                    const ap = this.getMajorBaseCell(t.ownerId).power;
                                    if (actorBase.power > ap * 1.5) weakAlly = ny*9+nx;
                                }
                            }
                        });
                    });
                    if (weakAlly !== null) return this.applyAction(id, 'break_alliance', weakAlly, 0);
                }
            }

            // 内政アクション
            if (actorBase.cash >= 20) return this.applyAction(id, 'plus_max', null, 0);
            if (this.state.taxUsed[id] < 5) return this.applyAction(id, 'tax', null, 0);
            this.applyAction(id, 'end', null, 0);
        }

        checkRoundVictory() {
            const alive = MAJORS.filter(m => this.state.grid.some(c => c.ownerId === m.id));
            if (alive.length === 1) {
                const roundWinner = alive[0]; this.state.winner = roundWinner.name; this.state.scores[roundWinner.id]++;
                this.addLog(`【ラウンド勝利】${roundWinner.name}`);
                if (this.state.scores[roundWinner.id] >= 2) { this.state.finalWinner = roundWinner.name; this.showFinalResult(); }
            }
        }

        showFinalResult() {
            const ranking = MAJORS.map(m => {
                return { name: m.name, score: this.state.scores[m.id], lands: this.state.maxLands[m.id], power: this.getMajorBaseCell(m.id).power };
            }).sort((a, b) => b.score - a.score || b.lands - a.lands || b.power - a.power);

            const list = document.getElementById('ranking-list'); list.innerHTML = "";
            ranking.slice(0, 3).forEach((r, i) => {
                const item = document.createElement('div'); item.className = `rank-item rank-${i+1}`;
                item.innerHTML = `<span>${i+1}位: ${r.name}</span><span>${r.score}勝 (${r.lands}領土)</span>`;
                list.appendChild(item);
            });
            document.getElementById('result-overlay').style.display = 'flex';
        }

        resetToHome() { location.reload(); }

        canIMove() { return this.state && this.state.isStarted && !this.state.winner && this.state.players[this.myPeerId] === MAJORS[this.state.turnIdx].id; }
        isAlly(id1, id2) { return this.state.alliances.some(a => (a[0] === id1 && a[1] === id2) || (a[0] === id2 && a[1] === id1)); }

        updateUI() {
            if (!this.state || !this.state.isStarted) return;
            document.getElementById('lobby').style.display = 'none';
            const gridEl = document.getElementById('grid'); gridEl.innerHTML = '';
            const activeId = MAJORS[this.state.turnIdx].id;
            this.state.grid.forEach((cell, i) => {
                const div = document.createElement('div'); div.className = 'cell';
                if (this.selectedIdx === i) div.classList.add('selected');
                if (cell.ownerId === activeId && !this.state.winner) div.classList.add('current-turn-glow');
                const owner = [...MAJORS, ...SUPERS, {id:'m', color:'#333'}, {id:'s', color:'#666'}].find(m => cell.ownerId.startsWith(m.id)) || {color:'#222'};
                div.style.background = owner.color || '#444';
                div.innerHTML = `<span>${MAJORS.find(m=>m.id===cell.ownerId)?.short || cell.short}</span>`;
                if (this.isAlly(activeId, cell.ownerId)) div.innerHTML += `<span class="ally-mark">🤝</span>`;
                div.onclick = () => { this.selectedIdx = i; this.updateUI(); };
                gridEl.appendChild(div);
            });
            if (this.selectedIdx !== null) {
                const c = this.state.grid[this.selectedIdx]; const isM = MAJORS.some(m => m.id === c.ownerId);
                const st = isM ? this.getMajorBaseCell(c.ownerId) : c; const ownerName = isM ? st.name : "NPC";
                document.getElementById('det-name').textContent = (isM && c.id !== c.ownerId) ? `${ownerName}領 ${c.name}` : c.name;
                document.getElementById('det-owner').textContent = ownerName;
                document.getElementById('det-power').textContent = st.power; document.getElementById('det-cash').textContent = st.cash;
            }
            const logBox = document.getElementById('game-log'); logBox.innerHTML = '';
            this.state.logs.forEach(msg => { const d = document.createElement('div'); d.textContent = `> ${msg}`; logBox.appendChild(d); });
            logBox.scrollTop = logBox.scrollHeight;
            const sb = document.getElementById('score-board'); sb.innerHTML = '';
            MAJORS.forEach(m => { sb.innerHTML += `<div class="score-row"><span>${m.name}</span> <span>${this.state.scores[m.id]} 勝</span></div>`; });
            const display = document.getElementById('turn-display');
            if (this.state.finalWinner) display.textContent = `覇者：${this.state.finalWinner}`;
            else if (this.state.winner) display.textContent = `勝者：${this.state.winner}`;
            else display.textContent = `${MAJORS[this.state.turnIdx].name}の番`;
            const myMid = this.state.players[this.myPeerId];
            document.getElementById('my-info').textContent = `担当：${MAJORS.find(m => m.id === myMid)?.name || '観戦者'}`;
            const canControl = this.canIMove() && !this.state.winner;
            document.getElementById('normal-actions').style.display = canControl ? 'grid' : 'none';
            document.getElementById('actions').style.display = (canControl || (this.isHost && this.state.winner && !this.state.finalWinner)) ? 'block' : 'none';
            if (canControl) document.getElementById('tax-btn').textContent = `徴税(${5 - this.state.taxUsed[myMid]})`;
            document.getElementById('host-round-actions').style.display = (this.isHost && this.state.winner && !this.state.finalWinner) ? "block" : "none";
        }
    }

    const game = new GameCore();

    function hostRoom() {
        const roomId = document.getElementById('room-id').value.trim(); if (!roomId) return alert("部屋名入力");
        game.isHost = true; game.peer = new Peer(roomId);
        game.peer.on('open', (id) => {
            game.myPeerId = id; game.state.players[id] = MAJORS[0].id;
            document.getElementById('room-display').textContent = "部屋ID：" + id;
            document.getElementById('lobby-setup').style.display = 'none'; document.getElementById('lobby-wait').style.display = 'block';
            document.getElementById('start-btn').style.display = 'block'; updateLobby();
        });
        game.peer.on('connection', (conn) => {
            game.conns[conn.peer] = conn;
            conn.on('open', () => {
                const n = Object.keys(game.state.players).length; if (n < 5) game.state.players[conn.peer] = MAJORS[n].id;
                game.broadcast(); updateLobby();
            });
            conn.on('data', (d) => {
                if (d.type === 'action') game.applyAction(d.actorId, d.actType, d.targetIdx, d.amount);
                if (d.type === 'alliance_answer') game.applyAction(d.fromId, d.agreed ? 'alliance_ok' : 'alliance_ng', d.toId, 0);
            });
            conn.on('close', () => { delete game.conns[conn.peer]; updateLobby(); });
        });
    }

    function joinRoom() {
        const roomId = document.getElementById('room-id').value.trim(); if (!roomId) return alert("部屋名入力");
        game.isHost = false; game.hostId = roomId; game.peer = new Peer();
        game.peer.on('open', (id) => {
            game.myPeerId = id; const conn = game.peer.connect(roomId); game.conns[roomId] = conn;
            conn.on('data', (d) => {
                if (d.type === 'sync') { game.state = d.state; game.updateUI(); updateLobby(); }
                if (d.type === 'alliance_request') {
                    game.pendingRequest = d; document.getElementById('alliance-modal').style.display = 'flex';
                    document.getElementById('alliance-request-text').textContent = `${MAJORS.find(m=>m.id===d.fromId).name}から同盟申請！`;
                    let left = 10; const tEl = document.getElementById('alliance-timer'); tEl.textContent = left;
                    game.allianceInterval = setInterval(() => { left--; tEl.textContent = left; if (left <= 0) game.answerAlliance(false); }, 1000);
                }
            });
            document.getElementById('lobby-setup').style.display = 'none'; document.getElementById('lobby-wait').style.display = 'block';
        });
    }

    function updateLobby() {
        const list = document.getElementById('player-list'); list.innerHTML = '<strong>参戦プレイヤー:</strong>';
        Object.entries(game.state.players).forEach(([pid, mid]) => {
            list.innerHTML += `<div>・${MAJORS.find(m => m.id === mid).name} (${pid === game.myPeerId ? 'あなた' : 'PL'})</div>`;
        });
    }
</script>
