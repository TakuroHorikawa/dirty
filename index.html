<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORLD WAR SUPREMACY: OVERDRIVE</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0c; --panel: #16161a; --border: #2a2a30; --text: #e0e0e6; --accent: #4f46e5;
            --ni: #8b0000; --de: #00008b; --uk: #006400; --fr: #b8860b; --ca: #4b0082;
            --danger: #e74c3c; --gold: #f1c40f; --silver: #bdc3c7; --bronze: #cd7f32; --success: #2ecc71;
            --sea: transparent;
        }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        @media (min-width: 900px) {
            body { flex-direction: row; }
            #sidebar { width: 340px; height: 100vh; position: sticky; top: 0; overflow-y: auto; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
            #main { flex: 1; padding: 20px; }
        }
        @media (max-width: 899px) {
            #sidebar { width: 100%; border-bottom: 1px solid var(--border); padding: 10px; box-sizing: border-box; }
            #main { width: 100%; padding: 10px; box-sizing: border-box; }
        }

        /* Lobby Phases */
        #lobby, #result-overlay, #generic-modal, #country-selection { position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .box { background: var(--panel); padding: 25px; border-radius: 12px; border: 1px solid var(--border); width: 90%; max-width: 450px; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.5); }

        input, select { background: #000; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        button { width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; background: var(--accent); color: white; margin-bottom: 4px; font-size: 13px; }
        button:hover:not(:disabled) { filter: brightness(1.2); }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Grid - 10 columns x 8 rows */
        #grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; width: 100%; max-width: 1000px; margin: 0 auto; aspect-ratio: 10 / 8; }
        .cell { aspect-ratio: 1; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: clamp(8px, 1.5vw, 12px); font-weight: bold; cursor: pointer; transition: 0.1s; position: relative; border: 1px solid rgba(255,255,255,0.05); }
        .cell.sea { visibility: hidden; pointer-events: none; }
        .cell:not(.sea):hover { border-color: #fff; z-index: 5; transform: scale(1.02); }
        .cell.selected { border: 2px solid #fff; box-shadow: 0 0 15px var(--accent); z-index: 10; }
        .ally-mark { position: absolute; top: 1px; right: 1px; font-size: 10px; }

        .info-card { background: var(--panel); padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border); }
        .log-box { flex: 1; overflow-y: auto; font-size: 11px; background: #000; padding: 8px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 5px; height: 120px; }
        .chat-area { display: flex; gap: 4px; }
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        
        .score-row { display: flex; justify-content: space-between; font-size: 11px; padding: 2px 0; }
        .current-turn-glow { animation: glow 1.5s infinite alternate; }
        @keyframes glow { from { box-shadow: 0 0 2px #fff; } to { box-shadow: 0 0 15px var(--accent); } }

        .modal-timer { font-size: 1.5rem; color: var(--danger); font-weight: bold; }
    </style>
</head>
<body>

    <!-- ロビー：モード選択 -->
    <div id="lobby">
        <div class="box">
            <h2 style="margin:0; letter-spacing: 2px;">WW SUPREMACY</h2>
            <div id="lobby-setup">
                <button onclick="game.setLobbyMode('solo')">一人でやる (AI対戦)</button>
                <button onclick="game.setLobbyMode('team')" style="background:var(--success)">チームでやる (マルチプレイ)</button>
                <div id="multi-setup" style="display:none; margin-top:15px;">
                    <input type="text" id="room-id" placeholder="部屋名を入力">
                    <button onclick="hostRoom()">部屋を作る</button>
                    <button onclick="joinRoom()" style="background:#333">参加する</button>
                </div>
            </div>
            <div id="lobby-wait" style="display:none">
                <p id="room-display" style="color:var(--accent); font-weight:bold;"></p>
                <div id="player-list" style="text-align:left; font-size:13px; margin-bottom:15px"></div>
                <button id="start-btn" onclick="game.start()" style="display:none; background:var(--success)">ゲーム開始</button>
                <small id="wait-msg">接続を待機中...</small>
            </div>
        </div>
    </div>

    <!-- 国選択画面 -->
    <div id="country-selection" style="display:none">
        <div class="box">
            <h3>操作する国を選択してください</h3>
            <div id="country-list"></div>
            <button id="confirm-country-btn" disabled onclick="game.confirmCountry()">決定して待機</button>
        </div>
    </div>

    <!-- リザルト -->
    <div id="result-overlay" style="display:none">
        <div class="box">
            <h1 style="color:var(--gold); margin-top:0;">最終結果発表</h1>
            <div id="ranking-list"></div>
            <button onclick="location.reload()" style="margin-top:20px; background:var(--danger); height:50px;">ホームに戻る</button>
        </div>
    </div>

    <!-- 汎用ポップアップ（同盟・交易承認） -->
    <div id="generic-modal" style="display:none">
        <div class="box">
            <h3 id="modal-text">申請が届きました</h3>
            <div class="modal-timer" id="modal-timer">20</div>
            <div id="modal-options" style="display:flex; gap:10px; margin-top:15px;">
                <button id="modal-yes" style="background:var(--success); flex:1;">承認</button>
                <button id="modal-no" style="background:var(--danger); flex:1;">拒否</button>
            </div>
        </div>
    </div>

    <!-- サイドバーUI -->
    <div id="sidebar">
        <div class="info-card">
            <h4 id="turn-display" style="color:var(--accent); margin:0">準備中</h4>
            <p id="my-info" style="font-size:11px; margin:5px 0 0; opacity:0.7"></p>
        </div>

        <div class="info-card">
            <div style="font-size: 10px; font-weight: bold; margin-bottom: 2px;">勝利スコア (2勝先取)</div>
            <div id="score-board"></div>
        </div>

        <div class="info-card" id="detail-panel">
            <div id="det-name" style="font-size: 0.9rem; font-weight: bold; color: var(--accent);">国を選択</div>
            <div id="det-stats" style="font-size: 11px; margin-top: 4px; line-height: 1.4;">
                所有者: <span id="det-owner">-</span> | 
                戦力: <span id="det-power" style="color:#ff7675">-</span> | 
                資金: <span id="det-cash" style="color:#ffeaa7">-</span>
            </div>
        </div>

        <div class="info-card" id="actions" style="display:none">
            <div class="flex-row" style="display:flex; gap:5px; margin-bottom:4px;">
                <input type="number" id="act-amount" value="20" min="10" step="10" style="margin:0; font-size:11px; height:24px; padding:2px;">
                <button onclick="game.handleActionRequest('plus_max')" style="background:var(--success); margin:0; padding:2px; height:28px;">軍拡(最大)</button>
            </div>
            <div class="action-grid" id="normal-actions">
                <button onclick="game.handleActionRequest('war')">戦争</button>
                <button onclick="game.handleActionRequest('tax')" id="tax-btn">徴税</button>
                <button onclick="game.handleActionRequest('alliance')">同盟</button>
                <button onclick="game.handleActionRequest('trade')">交易</button>
                <button onclick="game.handleActionRequest('break_alliance')" style="background: var(--danger)">破棄</button>
                <button onclick="game.handleActionRequest('end')" style="background:#333">終了</button>
            </div>
            <div id="host-round-actions" style="display:none; margin-top:4px;">
                <button onclick="game.nextRound()" style="background:#4f46e5;">次のラウンドへ</button>
            </div>
        </div>

        <div class="info-card" style="flex:1; display:flex; flex-direction:column;">
            <div class="log-box" id="game-log"></div>
            <div class="chat-area">
                <input type="text" id="chat-input" placeholder="チャット..." style="margin:0; font-size:11px; height:24px;">
                <button onclick="game.sendChat()" style="width:40px; margin:0; padding:0; height:28px;">送</button>
            </div>
        </div>
    </div>

    <div id="main">
        <div id="grid"></div>
    </div>

<script>
    // TURN/STUNサーバー設定
    const peerConfig = {
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
                { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" }
            ]
        }
    };

    const MAJORS = [
        { id: 'uk', name: 'イギリス', short: '英国', color: '#006400', power: 10, cash: 30 },
        { id: 'fr', name: 'フランス', short: '仏国', color: '#b8860b', power: 10, cash: 30 },
        { id: 'de', name: 'ドイツ', short: '独国', color: '#00008b', power: 10, cash: 30 },
        { id: 'jp', name: '日本', short: '日本', color: '#8b0000', power: 10, cash: 30 },
        { id: 'ca', name: 'カナダ', short: '加国', color: '#4b0082', power: 10, cash: 30 }
    ];
    const SUPERS = [
        { id: 'us', name: 'アメリカ', short: '米国', color: '#000', power: 300, cash: 900 },
        { id: 'cn', name: '中国', short: '中国', color: '#000', power: 300, cash: 900 },
        { id: 'ru', name: 'ロシア', short: '露国', color: '#000', power: 300, cash: 900 },
        { id: 'in', name: 'インド', short: '印国', color: '#000', power: 300, cash: 900 },
        { id: 'br', name: 'ブラジル', short: '伯国', color: '#000', power: 300, cash: 900 }
    ];
    const MIDDLES = ["オーストラリア", "韓国", "イタリア", "スペイン", "メキシコ", "インドネシア", "トルコ", "サウジアラビア", "南アフリカ", "アルゼンチン", "オランダ", "スイス", "スウェーデン", "ポーランド", "タイ", "マレーシア", "フィリピン", "エジプト", "パキスタン", "ナイジェリア", "イラン", "コロンビア"]
        .map((n, i) => ({ id: `m${i}`, name: n, short: n.slice(0, 2), color: '#333', power: 50, cash: 150 }));
    const SMALLS = ["ニュージーランド", "シンガポール", "アイルランド", "ノルウェー", "デンマーク", "フィンランド", "ベルギー", "オーストリア", "ポルトガル", "ギリシャ", "イスラエル", "チェコ", "ハンガリー", "ルーマニア", "ブルガリア", "スロバキア", "クロアチア", "リトアニア", "ラトビア", "エストニア", "アイスランド", "ルクセンブルク", "モナコ", "リヒテンシュタイン", "アンドラ", "サンマリノ", "ブータン", "モルディブ", "フィジー", "ブルネイ", "バーレーン", "カタール", "オマーン", "ウルグアイ", "パラグアイ", "エクアドル", "ジャマイカ", "トリニダード・トバゴ", "バハマ", "キプロス"]
        .map((n, i) => ({ id: `s${i}`, name: n, short: n.slice(0, 2), color: '#666', power: 10, cash: 30 }));

    class GameCore {
        constructor() {
            this.state = null; this.resetData();
            this.peer = null; this.conns = {}; this.myPeerId = null; this.isHost = false; 
            this.selectedIdx = null; this.hostId = null; this.myCountryId = null;
            this.modalTimer = null; this.isSelectingForTrade = false;
        }

        resetData() {
            this.state = { 
                grid: [], turnIdx: 0, players: {}, taxUsed: {}, alliances: [], isStarted: false, winner: null, 
                scores: { uk: 0, fr: 0, de: 0, jp: 0, ca: 0 }, 
                maxLands: { uk: 0, fr: 0, de: 0, jp: 0, ca: 0 },
                warCooldown: { uk: 0, fr: 0, de: 0, jp: 0, ca: 0 },
                round: 1, finalWinner: null, logs: [] 
            };
        }

        // ロビー処理
        setLobbyMode(mode) {
            if (mode === 'solo') {
                this.isHost = true;
                this.showCountrySelection();
            } else {
                document.getElementById('multi-setup').style.display = 'block';
            }
        }

        showCountrySelection() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('country-selection').style.display = 'flex';
            this.renderCountryList();
        }

        renderCountryList() {
            const list = document.getElementById('country-list');
            list.innerHTML = '';
            MAJORS.forEach(m => {
                const isTaken = Object.values(this.state.players).includes(m.id);
                const btn = document.createElement('button');
                btn.textContent = m.name + (isTaken ? " (選択済)" : "");
                btn.disabled = isTaken;
                btn.style.background = m.color;
                btn.onclick = () => {
                    this.myCountryId = m.id;
                    document.getElementById('confirm-country-btn').disabled = false;
                    this.renderCountryList(); // re-render to show selection
                };
                if (this.myCountryId === m.id) btn.style.border = "4px solid white";
                list.appendChild(btn);
            });
        }

        confirmCountry() {
            if (this.isHost) {
                this.state.players[this.myPeerId || 'host'] = this.myCountryId;
                if (Object.keys(this.state.players).length === 1 && this.peer === null) {
                    // Solo mode: start immediately
                    this.start();
                } else {
                    document.getElementById('country-selection').style.display = 'none';
                    document.getElementById('lobby-wait').style.display = 'block';
                    document.getElementById('start-btn').style.display = 'block';
                    this.broadcast();
                }
            } else {
                this.conns[this.hostId].send({ type: 'select_country', peerId: this.myPeerId, countryId: this.myCountryId });
                document.getElementById('country-selection').style.display = 'none';
                document.getElementById('lobby-wait').style.display = 'block';
            }
        }

        // マップ・ゲーム開始
        initMap() {
            const allCountries = [...MAJORS, ...SUPERS, ...MIDDLES, ...SMALLS];
            const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } };
            shuffle(allCountries);

            this.state.grid = Array(80).fill(null).map((_, i) => {
                const x = i % 10, y = Math.floor(i / 10);
                if (x >= 8 && y < 4) return { isSea: true };
                const c = allCountries.pop();
                return { ...c, ownerId: c.id, pos: i, power: c.power, cash: c.cash };
            });

            MAJORS.forEach(m => { this.state.taxUsed[m.id] = 0; this.state.warCooldown[m.id] = 0; });
            this.state.alliances = []; this.state.winner = null; this.state.turnIdx = 0; this.selectedIdx = null;
        }

        start() {
            this.initMap();
            this.state.isStarted = true;
            this.addLog(`第1ラウンド開始。`);
            this.broadcast();
            document.getElementById('country-selection').style.display = 'none';
        }

        nextRound() {
            this.state.round++;
            this.initMap();
            this.addLog(`第 ${this.state.round} ラウンド開始。`);
            this.broadcast();
        }

        broadcast() {
            if (!this.isHost) return;
            MAJORS.forEach(m => {
                const count = this.state.grid.filter(c => c && !c.isSea && c.ownerId === m.id).length;
                if (count > this.state.maxLands[m.id]) this.state.maxLands[m.id] = count;
            });
            Object.values(this.conns).forEach(c => c.send({ type: 'sync', state: this.state }));
            this.updateUI();
        }

        addLog(msg) {
            if (!this.isHost) return;
            this.state.logs.push(msg);
            if (this.state.logs.length > 50) this.state.logs.shift();
        }

        sendChat() {
            const input = document.getElementById('chat-input');
            const txt = input.value.trim();
            if (!txt) return;
            const msg = `${MAJORS.find(m => m.id === this.myCountryId)?.name || '??'}: ${txt}`;
            if (this.isHost) {
                this.addLog(msg); this.broadcast();
            } else {
                this.conns[this.hostId].send({ type: 'chat', msg });
            }
            input.value = '';
        }

        // アクション
        handleActionRequest(type) {
            if (!this.canIMove() || this.isSelectingForTrade) return;
            const myId = this.state.players[this.myPeerId || 'host'];
            const amount = parseInt(document.getElementById('act-amount').value) || 20;

            if (type === 'trade') {
                if (this.selectedIdx === null) return alert("交易相手の領土を選択してください");
                const targetId = this.state.grid[this.selectedIdx].ownerId;
                if (!MAJORS.some(m => m.id === targetId) || targetId === myId) return alert("相手は他プレイヤーである必要があります");
                if (this.isHost) this.applyAction(myId, 'trade_init', this.selectedIdx, amount);
                else this.conns[this.hostId].send({ type: 'action', actorId: myId, actType: 'trade_init', targetIdx: this.selectedIdx, amount });
                return;
            }

            if (this.isHost) this.applyAction(myId, type, this.selectedIdx, amount);
            else this.conns[this.hostId].send({ type: 'action', actorId: myId, actType: type, targetIdx: this.selectedIdx, amount });
        }

        getMajorBaseCell(majorId) { return this.state.grid.find(c => c && !c.isSea && c.id === majorId); }

        applyAction(actorId, type, targetIdx, amount) {
            if (!this.isHost || this.state.winner) return;
            const actorBase = this.getMajorBaseCell(actorId);
            const myCells = this.state.grid.filter(c => c && !c.isSea && c.ownerId === actorId);
            let logMsg = "";

            switch(type) {
                case 'war':
                    if (targetIdx === null) break;
                    const targetCell = this.state.grid[targetIdx];
                    if (!targetCell || targetCell.isSea || targetCell.ownerId === actorId || this.isAlly(actorId, targetCell.ownerId)) break;
                    
                    // 隣接判定（海越え含む）
                    if (!this.isAdjacent(myCells.map(c => c.pos), targetIdx)) break;
                    
                    const isMajor = MAJORS.some(m => m.id === targetCell.ownerId);
                    const enemyPower = isMajor ? this.getMajorBaseCell(targetCell.ownerId).power : targetCell.power;
                    
                    if (actorBase.power > enemyPower) {
                        actorBase.power -= enemyPower;
                        const enemyBase = isMajor ? this.getMajorBaseCell(targetCell.ownerId) : targetCell;
                        actorBase.cash += enemyBase.cash;
                        if (isMajor) {
                            const targetOwnerId = targetCell.ownerId;
                            this.state.grid.forEach(c => { if(c && !c.isSea && c.ownerId === targetOwnerId) c.ownerId = actorId; });
                            enemyBase.power = 0; enemyBase.cash = 0;
                            logMsg = `⚠️ ${actorBase.name}が${enemyBase.name}を滅亡させた！`;
                        } else {
                            logMsg = `${actorBase.name}が${targetCell.name}を制圧。`;
                            targetCell.ownerId = actorId;
                        }
                        if (!Object.values(this.state.players).includes(actorId)) this.state.warCooldown[actorId] = 3;
                        this.checkRoundVictory();
                    } else { logMsg = `${actorBase.name}の侵攻は失敗。`; }
                    break;

                case 'tax':
                    if (this.state.taxUsed[actorId] < 5) {
                        const gain = myCells.length * 20; actorBase.cash += gain; this.state.taxUsed[actorId]++;
                        logMsg = `${actorBase.name}が徴税(+${gain})`;
                    } break;

                case 'plus_max':
                    const maxP = Math.floor(actorBase.cash / 2);
                    if (maxP > 0) { actorBase.cash -= maxP * 2; actorBase.power += maxP; logMsg = `${actorBase.name}が限界軍拡。`; }
                    break;

                case 'alliance':
                    if (targetIdx === null) break;
                    const tid = this.state.grid[targetIdx].ownerId;
                    if (MAJORS.some(m => m.id === tid) && tid !== actorId) {
                        const targetPeer = Object.keys(this.state.players).find(key => this.state.players[key] === tid);
                        if (targetPeer && targetPeer !== 'host') {
                            this.conns[targetPeer].send({ type: 'modal_request', modalType: 'alliance', fromId: actorId });
                            return; 
                        } else {
                            this.state.alliances.push([actorId, tid]);
                            logMsg = `🤝 ${actorBase.name}と${MAJORS.find(m=>m.id===tid).name}が同盟。`;
                        }
                    } break;

                case 'trade_init':
                    const targetIdTrade = this.state.grid[targetIdx].ownerId;
                    const targetPeerTrade = Object.keys(this.state.players).find(key => this.state.players[key] === targetIdTrade);
                    if (targetPeerTrade && targetPeerTrade !== 'host') {
                        this.conns[targetPeerTrade].send({ type: 'modal_request', modalType: 'trade_1', fromId: actorId, amount });
                        return;
                    } break;

                case 'trade_step2': // Bが領土を選んだ
                    const senderPeer = Object.keys(this.state.players).find(key => this.state.players[key] === actorId);
                    if (senderPeer && senderPeer !== 'host') {
                        this.conns[senderPeer].send({ type: 'modal_request', modalType: 'trade_2', fromId: targetIdx, amount, cellIdx: amount }); // amount変数を流用
                    } break;

                case 'trade_final':
                    const aBase = this.getMajorBaseCell(actorId);
                    const bBase = this.getMajorBaseCell(targetIdx); // BのID
                    const tradedCell = this.state.grid[amount]; // 土地
                    if (aBase.cash >= targetIdx) { // targetIdxを要求金額として流用
                        aBase.cash -= targetIdx;
                        bBase.cash += targetIdx;
                        tradedCell.ownerId = bBase.id;
                        logMsg = `💰 交易成立：${aBase.name}の領土が${bBase.name}へ渡り、資金${targetIdx}が支払われた。`;
                    } break;

                case 'break_alliance':
                    if (targetIdx === null) break;
                    const b_tid = this.state.grid[targetIdx].ownerId;
                    if (this.isAlly(actorId, b_tid)) {
                        this.state.alliances = this.state.alliances.filter(p => !(p.includes(actorId) && p.includes(b_tid)));
                        logMsg = `⚠️ ${actorBase.name}が同盟を破棄。`;
                    } break;
                
                case 'end': logMsg = `${actorBase.name}はターン終了。`; break;
            }
            if (logMsg) this.addLog(logMsg);
            this.nextTurn();
        }

        isAdjacent(myPosList, targetIdx) {
            const tx = targetIdx % 10, ty = Math.floor(targetIdx / 10);
            return myPosList.some(p => {
                const mx = p % 10, my = Math.floor(p / 10);
                const dist = Math.abs(mx - tx) + Math.abs(my - ty);
                if (dist === 1) return true;
                // 海を越えた橋 (X=7 と X=8)
                if (mx === 7 && tx === 8 && Math.abs(my - ty) <= 1 && ty >= 4) return true;
                if (mx === 8 && tx === 7 && Math.abs(my - ty) <= 1 && my >= 4) return true;
                return false;
            });
        }

        // モーダル・タイマー処理
        showModal(type, fromId, amount = 0, cellIdx = 0) {
            const modal = document.getElementById('generic-modal');
            const text = document.getElementById('modal-text');
            const timerEl = document.getElementById('modal-timer');
            modal.style.display = 'flex';
            let timeLeft = (type.startsWith('trade')) ? 20 : 10;
            timerEl.textContent = timeLeft;

            const fromName = MAJORS.find(m => m.id === fromId).name;
            if (type === 'alliance') text.textContent = `${fromName}から同盟申請`;
            else if (type === 'trade_1') text.textContent = `${fromName}が資金${amount}を要求。対価として相手の領土を1つ奪いますか？`;
            else if (type === 'trade_2') text.textContent = `${fromName}から提案：領土「${this.state.grid[cellIdx].name}」と引き換えに資金${amount}を支払いますか？`;

            this.modalTimer = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) { this.closeModal(false, type, fromId, amount, cellIdx); }
            }, 1000);

            document.getElementById('modal-yes').onclick = () => this.closeModal(true, type, fromId, amount, cellIdx);
            document.getElementById('modal-no').onclick = () => this.closeModal(false, type, fromId, amount, cellIdx);
        }

        closeModal(agreed, type, fromId, amount, cellIdx) {
            clearInterval(this.modalTimer);
            document.getElementById('generic-modal').style.display = 'none';
            if (type === 'alliance') {
                const ans = agreed ? 'alliance_ok' : 'alliance_ng';
                if (this.isHost) this.applyAction(fromId, ans, this.myCountryId, 0);
                else this.conns[this.hostId].send({ type: 'alliance_answer', fromId, toId: this.myCountryId, agreed });
            } else if (type === 'trade_1') {
                if (agreed) {
                    this.isSelectingForTrade = true;
                    this.tradeContext = { fromId, amount };
                    alert("地図から奪いたい相手の領土をクリックしてください");
                } else {
                    if (this.isHost) { this.addLog("交易は拒否されました"); this.nextTurn(); }
                    else this.conns[this.hostId].send({ type: 'chat', msg: "交易は拒否されました" });
                }
            } else if (type === 'trade_2') {
                if (agreed) {
                    if (this.isHost) this.applyAction(fromId, 'trade_final', this.myCountryId, cellIdx); // cellIdxをamount引数として再利用
                    else this.conns[this.hostId].send({ type: 'action', actorId: fromId, actType: 'trade_final', targetIdx: this.myCountryId, amount: cellIdx });
                } else {
                    this.nextTurn();
                }
            }
        }

        // ターン・勝利
        nextTurn() {
            if (!this.isHost) return;
            if (this.state.winner) { this.broadcast(); return; }
            this.state.turnIdx = (this.state.turnIdx + 1) % 5;
            const nextId = MAJORS[this.state.turnIdx].id;
            if (!this.state.grid.some(c => c && !c.isSea && c.ownerId === nextId)) return this.nextTurn();
            this.broadcast();
            const isHuman = Object.values(this.state.players).includes(nextId);
            if (!isHuman && !this.state.winner) setTimeout(() => this.runAI(nextId), 600);
        }

        runAI(id) {
            const actorBase = this.getMajorBaseCell(id);
            const myCells = this.state.grid.filter(c => c && !c.isSea && c.ownerId === id);
            if (this.state.warCooldown[id] > 0) { this.state.warCooldown[id]--; } 
            else {
                let bestT = null; let minP = Infinity;
                myCells.forEach(mc => {
                    const x = mc.pos % 10, y = Math.floor(mc.pos / 10);
                    [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx, dy]) => {
                        const nx = x+dx, ny = y+dy;
                        if(nx>=0 && nx<10 && ny>=0 && ny<8) {
                            const t = this.state.grid[ny*10+nx];
                            if(t && !t.isSea && t.ownerId !== id && !this.isAlly(id, t.ownerId)) {
                                const isM = MAJORS.some(m => m.id === t.ownerId);
                                const p = isM ? this.getMajorBaseCell(t.ownerId).power : t.power;
                                if (actorBase.power > p && p < minP) { minP = p; bestT = ny*10+nx; }
                            }
                        }
                    });
                });
                if (bestT !== null) return this.applyAction(id, 'war', bestT, 0);
            }
            if (actorBase.cash >= 20) return this.applyAction(id, 'plus_max', null, 0);
            if (this.state.taxUsed[id] < 5) return this.applyAction(id, 'tax', null, 0);
            this.applyAction(id, 'end', null, 0);
        }

        checkRoundVictory() {
            const alive = MAJORS.filter(m => this.state.grid.some(c => c && !c.isSea && c.ownerId === m.id));
            if (alive.length === 1) {
                const roundWinner = alive[0]; this.state.winner = roundWinner.name; this.state.scores[roundWinner.id]++;
                this.addLog(`【ラウンド勝利】${roundWinner.name}`);
                if (this.state.scores[roundWinner.id] >= 2) { this.state.finalWinner = roundWinner.name; this.showFinalResult(); }
            }
        }

        showFinalResult() {
            const ranking = MAJORS.map(m => ({
                name: m.name, score: this.state.scores[m.id], lands: this.state.maxLands[m.id], power: this.getMajorBaseCell(m.id)?.power || 0
            })).sort((a, b) => b.score - a.score || b.lands - a.lands || b.power - a.power);
            const list = document.getElementById('ranking-list'); list.innerHTML = "";
            ranking.slice(0, 3).forEach((r, i) => {
                const item = document.createElement('div'); item.className = `rank-item rank-${i+1}`;
                item.innerHTML = `<span>${i+1}位: ${r.name}</span><span>${r.score}勝 (${r.lands}領土)</span>`;
                list.appendChild(item);
            });
            document.getElementById('result-overlay').style.display = 'flex';
        }

        // UI更新
        canIMove() { return this.state && this.state.isStarted && !this.state.winner && this.state.players[this.myPeerId || 'host'] === MAJORS[this.state.turnIdx].id; }
        isAlly(id1, id2) { return this.state.alliances.some(a => (a[0] === id1 && a[1] === id2) || (a[0] === id2 && a[1] === id1)); }

        updateUI() {
            if (!this.state || !this.state.isStarted) return;
            const gridEl = document.getElementById('grid'); gridEl.innerHTML = '';
            const activeId = MAJORS[this.state.turnIdx].id;

            this.state.grid.forEach((cell, i) => {
                const div = document.createElement('div'); div.className = 'cell';
                if (cell.isSea) { div.classList.add('sea'); }
                else {
                    if (this.selectedIdx === i) div.classList.add('selected');
                    if (cell.ownerId === activeId && !this.state.winner) div.classList.add('current-turn-glow');
                    const owner = [...MAJORS, ...SUPERS, {id:'m', color:'#333'}, {id:'s', color:'#666'}].find(m => cell.ownerId.startsWith(m.id)) || {color:'#222'};
                    div.style.background = owner.color || '#444';
                    div.innerHTML = `<span>${MAJORS.find(m=>m.id===cell.ownerId)?.short || cell.short}</span>`;
                    if (this.isAlly(activeId, cell.ownerId)) div.innerHTML += `<span class="ally-mark">🤝</span>`;
                    div.onclick = () => {
                        if (this.isSelectingForTrade) {
                            if (cell.ownerId === this.tradeContext.fromId) {
                                this.isSelectingForTrade = false;
                                if (this.isHost) this.applyAction(this.myCountryId, 'trade_step2', this.tradeContext.fromId, i); // amountにiを入れる
                                else this.conns[this.hostId].send({ type: 'action', actorId: this.myCountryId, actType: 'trade_step2', targetIdx: this.tradeContext.fromId, amount: i });
                            } else {
                                alert("相手の領土を選んでください");
                            }
                            return;
                        }
                        this.selectedIdx = i; this.updateUI();
                    };
                }
                gridEl.appendChild(div);
            });

            if (this.selectedIdx !== null) {
                const c = this.state.grid[this.selectedIdx]; 
                if (c && !c.isSea) {
                    const isM = MAJORS.some(m => m.id === c.ownerId);
                    const st = isM ? this.getMajorBaseCell(c.ownerId) : c;
                    const ownerName = isM ? st.name : "NPC";
                    document.getElementById('det-name').textContent = (isM && c.id !== c.ownerId) ? `${ownerName}領 ${c.name}` : c.name;
                    document.getElementById('det-owner').textContent = ownerName;
                    document.getElementById('det-power').textContent = st.power; document.getElementById('det-cash').textContent = st.cash;
                }
            }

            const logBox = document.getElementById('game-log'); logBox.innerHTML = '';
            this.state.logs.slice().reverse().forEach(msg => { const d = document.createElement('div'); d.textContent = `> ${msg}`; logBox.appendChild(d); });
            const sb = document.getElementById('score-board'); sb.innerHTML = '';
            MAJORS.forEach(m => { sb.innerHTML += `<div class="score-row"><span>${m.name}</span> <span>${this.state.scores[m.id]}勝</span></div>`; });
            document.getElementById('turn-display').textContent = this.state.finalWinner ? `覇者:${this.state.finalWinner}` : (this.state.winner ? `勝者:${this.state.winner}` : `${MAJORS[this.state.turnIdx].name}の番`);
            const myMid = this.state.players[this.myPeerId || 'host'];
            document.getElementById('my-info').textContent = `担当：${MAJORS.find(m => m.id === myMid)?.name || '観戦者'}`;
            const canControl = this.canIMove() && !this.state.winner;
            document.getElementById('actions').style.display = (canControl || (this.isHost && this.state.winner && !this.state.finalWinner)) ? 'block' : 'none';
            document.getElementById('host-round-actions').style.display = (this.isHost && this.state.winner && !this.state.finalWinner) ? "block" : "none";
        }
    }

    const game = new GameCore();

    function hostRoom() {
        const roomId = document.getElementById('room-id').value.trim(); if (!roomId) return alert("部屋名入力");
        game.isHost = true; game.peer = new Peer(roomId, peerConfig);
        game.peer.on('open', (id) => {
            game.myPeerId = id; 
            document.getElementById('room-display').textContent = "部屋ID：" + id;
            document.getElementById('lobby-setup').style.display = 'none'; document.getElementById('lobby-wait').style.display = 'block';
            updateLobby();
        });
        game.peer.on('connection', (conn) => {
            game.conns[conn.peer] = conn;
            conn.on('data', (d) => {
                if (d.type === 'select_country') { game.state.players[d.peerId] = d.countryId; game.broadcast(); updateLobby(); }
                if (d.type === 'action') game.applyAction(d.actorId, d.actType, d.targetIdx, d.amount);
                if (d.type === 'alliance_answer') game.applyAction(d.fromId, d.agreed ? 'alliance_ok' : 'alliance_ng', d.toId, 0);
                if (d.type === 'chat') { game.addLog(d.msg); game.broadcast(); }
            });
            conn.on('close', () => { delete game.conns[conn.peer]; updateLobby(); });
        });
        game.peer.on('error', (err) => { document.getElementById('wait-msg').textContent = "通信エラー: " + err.type; });
    }

    function joinRoom() {
        const roomId = document.getElementById('room-id').value.trim(); if (!roomId) return alert("部屋名入力");
        game.isHost = false; game.hostId = roomId; game.peer = new Peer(peerConfig);
        game.peer.on('open', (id) => {
            game.myPeerId = id; const conn = game.peer.connect(roomId); game.conns[roomId] = conn;
            conn.on('data', (d) => {
                if (d.type === 'sync') { game.state = d.state; game.updateUI(); updateLobby(); }
                if (d.type === 'modal_request') game.showModal(d.modalType, d.fromId, d.amount, d.cellIdx);
            });
            document.getElementById('lobby-setup').style.display = 'none';
            game.showCountrySelection();
        });
        game.peer.on('error', (err) => { document.getElementById('wait-msg').textContent = "通信エラー: " + err.type; });
    }

    function updateLobby() {
        const list = document.getElementById('player-list'); list.innerHTML = '<strong>参戦プレイヤー:</strong>';
        Object.entries(game.state.players).forEach(([pid, mid]) => {
            list.innerHTML += `<div>・${MAJORS.find(m => m.id === mid).name} (${pid === game.myPeerId ? 'あなた' : 'PL'})</div>`;
        });
        if (game.isHost) document.getElementById('start-btn').style.display = 'block';
    }
</script>
