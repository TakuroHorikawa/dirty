<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界大戦 - Fixed</title>
    <!-- PeerJS 最新版を使用 -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0d0d0d; --panel: #1a1a1a; --border: #333; --text: #e0e0e0; --accent: #4f46e5;
            --ni: #8b0000; --de: #00008b; --uk: #006400; --fr: #b8860b; --ca: #4b0082;
        }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        @media (min-width: 850px) { body { flex-direction: row; } #sidebar { width: 320px; height: 100vh; position: sticky; top: 0; overflow-y: auto; border-right: 1px solid var(--border); } #main { flex: 1; padding: 20px; } }
        @media (max-width: 849px) { #sidebar { width: 100%; border-bottom: 1px solid var(--border); padding: 15px; box-sizing: border-box; } #main { width: 100%; padding: 10px; box-sizing: border-box; } }
        #lobby { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .lobby-box { background: var(--panel); padding: 30px; border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; background: var(--accent); color: white; margin-bottom: 8px; }
        button:hover:not(:disabled) { filter: brightness(1.2); }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        #grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; width: 100%; max-width: 800px; margin: 0 auto; aspect-ratio: 9/6; }
        .cell { aspect-ratio: 1; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: clamp(10px, 2vw, 16px); font-weight: bold; cursor: pointer; transition: 0.1s; position: relative; border: 1px solid rgba(255,255,255,0.1); }
        .cell:hover { transform: scale(1.05); z-index: 10; border-color: #fff; }
        .cell.selected { border: 2px solid #fff; box-shadow: 0 0 15px var(--accent); }
        .ally-mark { position: absolute; top: 2px; right: 2px; font-size: 14px; }
        .info-card { background: var(--panel); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border); }
        .log-box { height: 150px; overflow-y: auto; font-size: 12px; background: #000; padding: 10px; border-radius: 6px; border: 1px solid var(--border); display: flex; flex-direction: column-reverse; }
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .current-turn-glow { animation: glow 1.5s infinite alternate; }
        @keyframes glow { from { box-shadow: 0 0 5px #fff; } to { box-shadow: 0 0 20px var(--accent); } }
    </style>
</head>
<body>
    <div id="lobby">
        <div class="lobby-box">
            <h2 style="margin-top:0">世界大戦</h2>
            <div id="lobby-setup">
                <input type="text" id="room-id" placeholder="部屋名を入力（英数字）">
                <button onclick="hostRoom()">部屋を作る</button>
                <button onclick="joinRoom()" style="background:#333">参加する</button>
                <p style="font-size:10px; color:#777; margin-top:10px;">※既存の部屋名は使えません。独自の言葉を推奨。</p>
            </div>
            <div id="lobby-wait" style="display:none">
                <p id="room-display" style="color:var(--accent); font-weight:bold;"></p>
                <div id="player-list" style="text-align:left; font-size:14px; margin-bottom:15px"></div>
                <button id="start-btn" onclick="game.start()" style="display:none; background:#10b981">ゲーム開始 (AI補充)</button>
                <small id="wait-msg">通信準備中...</small>
            </div>
        </div>
    </div>

    <div id="sidebar">
        <div class="info-card">
            <h3 id="turn-display" style="color:var(--accent); margin:0">待機中</h3>
            <p id="my-info" style="font-size:14px; margin:5px 0 0; opacity:0.7"></p>
        </div>
        <div class="info-card" id="detail-panel">
            <div id="det-name" style="font-size: 1.1rem; font-weight: bold;">国を選択</div>
            <div id="det-stats" style="font-size: 14px; margin-top: 8px; line-height: 1.6;">
                所有者: <span id="det-owner">-</span><br>
                総戦力: <span id="det-power">-</span><br>
                総資金: <span id="det-cash">-</span>
            </div>
        </div>
        <div class="info-card" id="actions" style="display:none">
            <div class="action-grid">
                <button onclick="game.handleActionRequest('war')">戦争</button>
                <button onclick="game.handleActionRequest('tax')" id="tax-btn">徴税</button>
                <button onclick="game.handleActionRequest('plus')">軍拡(+10)</button>
                <button onclick="game.handleActionRequest('minus')">軍縮(+20)</button>
                <button onclick="game.handleActionRequest('alliance')">同盟</button>
                <button onclick="game.handleActionRequest('aid')">援助</button>
                <button onclick="game.handleActionRequest('end')" style="grid-column: span 2; background:#333">ターンエンド</button>
            </div>
        </div>
        <div class="info-card">
            <div class="log-box" id="game-log"></div>
        </div>
    </div>

    <div id="main">
        <div id="grid"></div>
    </div>

<script>
    // 国データ
    const MAJORS = [
        { id: 'ni', name: 'ニホン', short: 'ニホ', color: '#8b0000', power: 10, cash: 30 },
        { id: 'de', name: 'ドイツ', short: 'ドイ', color: '#00008b', power: 10, cash: 30 },
        { id: 'uk', name: 'イギリス', short: 'イギ', color: '#006400', power: 10, cash: 30 },
        { id: 'fr', name: 'フランス', short: 'フラ', color: '#b8860b', power: 10, cash: 30 },
        { id: 'ca', name: 'カナダ', short: 'カナ', color: '#4b0082', power: 10, cash: 30 }
    ];
    const SUPERS = [
        { id: 'us', name: 'アメリカ', short: 'アメ', color: '#000', power: 500, cash: 1500 },
        { id: 'ru', name: 'ロシア', short: 'ロシ', color: '#000', power: 500, cash: 1500 },
        { id: 'cn', name: 'チュウゴク', short: 'チュ', color: '#000', power: 500, cash: 1500 },
        { id: 'in', name: 'インド', short: 'イン', color: '#000', power: 500, cash: 1500 }
    ];
    const MIDDLE = ["カンコク", "イタリア", "ブラジル", "トルコ", "メキシコ", "スペイン", "ベトナム", "エジプト", "タイ", "ポーランド", "オランダ", "スイス", "イラン", "ギリシャ", "チリ"]
        .map((n, i) => ({ id: `m${i}`, name: n, short: n.slice(0, 2), color: '#444', power: 100, cash: 300 }));
    const SMALL = Array.from({length: 30}).map((_, i) => ({ id: `s${i}`, name: `小国${i+1}`, short: 'ショ', color: '#888', power: 10, cash: 30 }));

    class GameCore {
        constructor() {
            this.state = { grid: [], turnIdx: 0, players: {}, taxUsed: {}, alliances: [], isStarted: false, winner: null };
            this.peer = null;
            this.conns = {};
            this.myPeerId = null;
            this.isHost = false;
            this.selectedIdx = null;
            this.hostId = null;
        }

        initMap() {
            const all = [...MAJORS, ...SUPERS, ...MIDDLE, ...SMALL];
            const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } };
            const checkAdjacent = (list) => {
                const isPowerful = (c) => MAJORS.concat(SUPERS).some(m => m.id === c.id);
                for (let i = 0; i < list.length; i++) {
                    if (!isPowerful(list[i])) continue;
                    const x = i % 9, y = Math.floor(i / 9);
                    for (let [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
                        const nx = x + dx, ny = y + dy;
                        if (nx >= 0 && nx < 9 && ny >= 0 && ny < 6 && isPowerful(list[ny * 9 + nx])) return false;
                    }
                }
                return true;
            };
            do { shuffle(all); } while (!checkAdjacent(all));
            this.state.grid = all.map((c, i) => ({ ...c, ownerId: c.id, pos: i, power: c.power, cash: c.cash }));
            MAJORS.forEach(m => this.state.taxUsed[m.id] = 0);
        }

        start() {
            if (!this.isHost) return;
            this.state.isStarted = true;
            this.addLog("世界大戦が勃発しました！");
            this.broadcastState();
        }

        broadcastState() {
            if (!this.isHost) return;
            const data = { type: 'sync', state: this.state };
            Object.values(this.conns).forEach(conn => conn.send(data));
            this.updateUI();
        }

        addLog(msg) {
            const log = document.getElementById('game-log');
            const div = document.createElement('div');
            div.textContent = `> ${msg}`;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        handleActionRequest(type) {
            if (!this.canIMove()) return;
            const myMajorId = this.state.players[this.myPeerId];
            if (this.isHost) {
                this.applyAction(myMajorId, type, this.selectedIdx);
            } else {
                const conn = this.conns[this.hostId];
                if (conn) conn.send({ type: 'action', actorId: myMajorId, actType: type, targetIdx: this.selectedIdx });
            }
        }

        applyAction(actorId, type, targetIdx) {
            if (!this.isHost) return;
            const actor = this.state.grid.find(c => c.id === actorId);
            const myCells = this.state.grid.filter(c => c.ownerId === actorId);
            let logMsg = "";

            switch(type) {
                case 'war':
                    if (targetIdx === null) break;
                    const target = this.state.grid[targetIdx];
                    if (target.ownerId === actorId) break;
                    const isAdj = myCells.some(mc => Math.abs((mc.pos % 9)-(target.pos % 9)) + Math.abs(Math.floor(mc.pos / 9)-Math.floor(target.pos / 9)) === 1);
                    if (!isAdj) break;
                    const isMajor = MAJORS.some(m => m.id === target.ownerId);
                    const enemyPower = isMajor ? this.state.grid.find(c => c.id === target.ownerId).power : target.power;
                    if (actor.power > enemyPower) {
                        actor.power -= enemyPower;
                        actor.cash += isMajor ? this.state.grid.find(c => c.id === target.ownerId).cash : target.cash;
                        logMsg = `${actor.name}が${target.name}を制圧！`;
                        target.ownerId = actorId;
                        if (isMajor) this.state.grid.find(c => c.id === target.ownerId).cash = 0;
                        this.checkVictory();
                    } else { logMsg = `${actor.name}の侵攻は失敗。`; }
                    break;
                case 'tax':
                    if (this.state.taxUsed[actorId] < 5) {
                        const gain = myCells.length * 20;
                        actor.cash += gain; this.state.taxUsed[actorId]++;
                        logMsg = `${actor.name}が徴税(+${gain})`;
                    } break;
                case 'plus':
                    if (actor.cash >= 20) { actor.cash -= 20; actor.power += 10; logMsg = `${actor.name}が軍拡(+10)`; }
                    break;
                case 'minus':
                    if (actor.power >= 10) { actor.power -= 10; actor.cash += 20; logMsg = `${actor.name}が軍縮(+20)`; }
                    break;
                case 'alliance':
                    if (targetIdx !== null) {
                        const tOwner = this.state.grid[targetIdx].ownerId;
                        if (MAJORS.some(m => m.id === tOwner) && tOwner !== actorId) {
                            this.state.alliances.push([actorId, tOwner]);
                            logMsg = `${actor.name}が${MAJORS.find(m => m.id === tOwner).name}と同盟。`;
                        }
                    } break;
                case 'aid':
                    if (targetIdx !== null) {
                        const aidId = this.state.grid[targetIdx].ownerId;
                        if (this.isAlly(actorId, aidId)) {
                            const targetActor = this.state.grid.find(c => c.id === aidId);
                            if (actor.power >= 5 && actor.cash >= 10) { actor.power -= 5; actor.cash -= 10; targetActor.power += 5; targetActor.cash += 10; logMsg = `${actor.name}が援助。`; }
                        }
                    } break;
                case 'end': logMsg = `${actor.name}が待機。`; break;
            }
            if (logMsg) this.addLog(logMsg);
            this.nextTurn();
        }

        nextTurn() {
            if (!this.isHost) return;
            this.state.turnIdx = (this.state.turnIdx + 1) % 5;
            const nextId = MAJORS[this.state.turnIdx].id;
            if (!this.state.grid.some(c => c.ownerId === nextId)) return this.nextTurn();
            this.broadcastState();
            const isHuman = Object.values(this.state.players).includes(nextId);
            if (!isHuman && !this.state.winner) setTimeout(() => this.runAI(nextId), 600);
        }

        runAI(id) {
            const actor = this.state.grid.find(c => c.id === id);
            if (this.state.taxUsed[id] < 5) return this.applyAction(id, 'tax', null);
            if (actor.cash >= 20) return this.applyAction(id, 'plus', null);
            // 攻撃可能な隣接国を探す
            const myCells = this.state.grid.filter(c => c.ownerId === id);
            for (let mc of myCells) {
                const x=mc.pos%9, y=Math.floor(mc.pos/9);
                for(let [dx,dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
                    const nx=x+dx, ny=y+dy;
                    if(nx>=0&&nx<9&&ny>=0&&ny<6) {
                        const target = this.state.grid[ny*9+nx];
                        if(target.ownerId !== id) {
                            const isMajor = MAJORS.some(m => m.id === target.ownerId);
                            const power = isMajor ? this.state.grid.find(c => c.id === target.ownerId).power : target.power;
                            if(actor.power > power) return this.applyAction(id, 'war', ny*9+nx);
                        }
                    }
                }
            }
            this.applyAction(id, 'end', null);
        }

        checkVictory() {
            const survivors = MAJORS.filter(m => this.state.grid.some(c => c.ownerId === m.id));
            if (survivors.length === 1) { this.state.winner = survivors[0].name; this.addLog(`覇者：${this.state.winner}`); }
        }

        canIMove() { return this.state.isStarted && !this.state.winner && this.state.players[this.myPeerId] === MAJORS[this.state.turnIdx].id; }
        isAlly(id1, id2) { return this.state.alliances.some(a => (a[0] === id1 && a[1] === id2) || (a[0] === id2 && a[1] === id1)); }

        updateUI() {
            if (this.state.isStarted) document.getElementById('lobby').style.display = 'none';
            const gridEl = document.getElementById('grid'); gridEl.innerHTML = '';
            const activeId = MAJORS[this.state.turnIdx].id;
            this.state.grid.forEach((cell, i) => {
                const div = document.createElement('div'); div.className = 'cell';
                if (this.selectedIdx === i) div.classList.add('selected');
                if (cell.ownerId === activeId) div.classList.add('current-turn-glow');
                const owner = MAJORS.concat(SUPERS, MIDDLE, SMALL).find(m => m.id === cell.ownerId) || cell;
                div.style.background = owner.color;
                div.innerHTML = `<span>${cell.short}</span>`;
                if (this.isAlly(activeId, cell.ownerId)) div.innerHTML += `<span class="ally-mark">🤝</span>`;
                div.onclick = () => {
                    this.selectedIdx = i;
                    const isMajor = MAJORS.some(m => m.id === cell.ownerId);
                    const ownerData = isMajor ? this.state.grid.find(c => c.id === cell.ownerId) : cell;
                    document.getElementById('det-name').textContent = cell.name;
                    document.getElementById('det-owner').textContent = isMajor ? ownerData.name : "NPC";
                    document.getElementById('det-power').textContent = ownerData.power;
                    document.getElementById('det-cash').textContent = ownerData.cash;
                    this.updateUI();
                };
                gridEl.appendChild(div);
            });
            document.getElementById('turn-display').textContent = MAJORS[this.state.turnIdx].name + "の手番";
            document.getElementById('my-info').textContent = `担当：${MAJORS.find(m => m.id === this.state.players[this.myPeerId])?.name || '観戦'}`;
            document.getElementById('actions').style.display = this.canIMove() ? 'block' : 'none';
            if (this.canIMove()) document.getElementById('tax-btn').textContent = `徴税(${5 - this.state.taxUsed[this.state.players[this.myPeerId]]})`;
            if (this.state.winner) document.getElementById('turn-display').textContent = "勝者：" + this.state.winner;
        }
    }

    const game = new GameCore();

    function hostRoom() {
        const roomId = document.getElementById('room-id').value.trim();
        if (!roomId) return alert("部屋名を入力してください");
        game.isHost = true;
        // ホスト自身のPeer（ランダムなIDで作成し、roomIdというエイリアスで待ち受ける）
        game.peer = new Peer(roomId);

        game.peer.on('open', (id) => {
            game.myPeerId = id;
            game.initMap();
            game.state.players[id] = MAJORS[0].id;
            document.getElementById('room-display').textContent = "部屋名：" + id;
            document.getElementById('lobby-setup').style.display = 'none';
            document.getElementById('lobby-wait').style.display = 'block';
            document.getElementById('start-btn').style.display = 'block';
            document.getElementById('wait-msg').textContent = "参加を待っています...";
            updateLobbyList();
        });

        game.peer.on('connection', (conn) => {
            game.conns[conn.peer] = conn;
            conn.on('open', () => {
                const count = Object.keys(game.state.players).length;
                if (count < 5) game.state.players[conn.peer] = MAJORS[count].id;
                game.broadcastState();
                updateLobbyList();
            });
            conn.on('data', (data) => {
                if (data.type === 'action') game.applyAction(data.actorId, data.actType, data.targetIdx);
            });
        });

        game.peer.on('error', (err) => {
            if (err.type === 'unavailable-id') alert("その部屋名はすでに使われています。別の名前を試してください。");
            else alert("通信エラー：" + err.type);
        });
    }

    function joinRoom() {
        const roomId = document.getElementById('room-id').value.trim();
        if (!roomId) return alert("部屋名を入力してください");
        game.isHost = false;
        game.hostId = roomId;
        game.peer = new Peer();

        game.peer.on('open', (id) => {
            game.myPeerId = id;
            const conn = game.peer.connect(roomId);
            game.conns[roomId] = conn;
            document.getElementById('lobby-setup').style.display = 'none';
            document.getElementById('lobby-wait').style.display = 'block';
            document.getElementById('wait-msg').textContent = "ホストに接続中...";

            conn.on('data', (data) => {
                if (data.type === 'sync') {
                    game.state = data.state;
                    game.updateUI();
                    updateLobbyList();
                }
            });
            conn.on('error', (err) => alert("接続エラー：" + err));
        });

        game.peer.on('error', (err) => alert("通信エラー：" + err.type));
    }

    function updateLobbyList() {
        const list = document.getElementById('player-list');
        list.innerHTML = '<strong>参加者：</strong>';
        Object.entries(game.state.players).forEach(([pid, mid]) => {
            const div = document.createElement('div');
            div.textContent = `・${MAJORS.find(m => m.id === mid).name} ${pid === game.myPeerId ? '(あなた)' : ''}`;
            list.appendChild(div);
        });
    }
</script>
</body>
</html>
