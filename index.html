<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World War III</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            /* デザイン設定 */
            --bg-main: #374151;
            --panel-bg: #1f2937;
            --border-color: #4b5563;
            --text-main: #f8fafc;
            /* 主要国カラー */
            --uk: #006400; --fr: #b8860b; --de: #00008b; --ni: #8b0000; --ca: #4b0082;
            --super-bg: #000000;
            --mid-bg: #334155; --small-bg: #64748b;
            /* UIアクセント */
            --danger: #ef4444; --gold: #f1c40f; --silver: #94a3b8; --bronze: #cd7f32; --success: #22c55e; --accent: #6366f1;
            --map-sea: #1e293b; 
            --btn-action: #4b5563;
        }

        body { 
            margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg-main); color: var(--text-main);
            display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; 
        }
        
        @media (min-width: 1000px) {
            body { flex-direction: row; }
            #sidebar { width: 360px; height: 100vh; position: sticky; top: 0; border-right: 1px solid var(--border-color); background: var(--panel-bg); display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; }
            #main { flex: 1; padding: 20px; background: var(--bg-main); display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
        }

        @media (max-width: 999px) {
            #sidebar { width: 100%; border-bottom: 1px solid var(--border-color); padding: 10px; background: var(--panel-bg); box-sizing: border-box; }
            #main { width: 100%; padding: 10px; box-sizing: border-box; overflow-x: auto; }
        }

        /* ロビー・モーダル */
        #lobby, #result-overlay, #generic-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .box { background: var(--panel-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); width: 90%; max-width: 500px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }

        input, select { background: #0f172a; border: 1px solid var(--border-color); color: #fff; padding: 12px; border-radius: 6px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .action-grid button { 
            width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; 
            transition: all 0.2s; background: var(--btn-action); color: white; font-size: 13px; border-bottom: 3px solid rgba(0,0,0,0.1);
        }
        .action-grid button:hover:not(:disabled) { background: #64748b; transform: translateY(-1px); }
        .action-grid button.break-btn { background: var(--danger); border-bottom-color: #991b1b; }
        button.primary-btn { background: var(--accent); color: white; padding: 14px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; width:100%; font-size: 1.1rem; }

        /* マップグリッド (12x8) */
        #grid-container { background: var(--map-sea); padding: 10px; border-radius: 12px; border: 4px solid #1e2937; width: 100%; max-width: 1100px; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; width: 100%; aspect-ratio: 12 / 8; }
        .cell { 
            aspect-ratio: 1; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            font-size: clamp(8px, 1.1vw, 12px); font-weight: bold; cursor: pointer; transition: 0.15s; position: relative; border: 1px solid rgba(255,255,255,0.1); color: #fff;
        }
        .cell.sea { visibility: hidden; pointer-events: none; border: none; }
        .cell:not(.sea):hover { border-color: #fff; z-index: 5; transform: scale(1.08); box-shadow: 0 0 15px rgba(255,255,255,0.3); }
        .cell.selected { border: 2px solid #fff; box-shadow: 0 0 15px var(--accent); z-index: 10; }
        .cell.trade-target { border: 2px solid var(--gold); animation: flash 1s infinite; }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .ally-mark { position: absolute; top: 1px; right: 1px; font-size: 10px; }

        /* 国選択パネル */
        #selection-panel { width: 100%; background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 12px; padding: 20px; margin-top: 20px; text-align: center; }
        .country-btn-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 15px; }
        .country-choice { padding: 12px 18px; border-radius: 8px; border: 3px solid transparent; cursor: pointer; font-weight: bold; font-size: 14px; min-width: 100px; color: white; transition: 0.2s; }
        .country-choice.taken { opacity: 0.15; cursor: not-allowed; text-decoration: line-through; filter: grayscale(1); }
        .country-choice.active { border-color: #fff; transform: scale(1.1); box-shadow: 0 0 20px rgba(255,255,255,0.4); }

        /* ログ・チャットエリア */
        .log-chat-container { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 10px; margin-top: 5px; }
        .scroll-box { overflow-y: auto; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 12px; }
        #game-log { flex: 1.2; min-height: 180px; border-left: 5px solid var(--accent); }
        #chat-box { flex: 1; min-height: 140px; color: #a5b4fc; border-left: 5px solid var(--success); }
        .chat-input-row { display: flex; gap: 6px; }
        
        .info-card { background: #1f2937; padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid var(--border-color); }
        .score-row { display: flex; justify-content: space-between; font-size: 12px; padding: 5px 0; border-bottom: 1px solid #374151; }
        .current-turn-glow { animation: glow 1.5s infinite alternate; }
        @keyframes glow { from { box-shadow: 0 0 5px #fff; } to { box-shadow: 0 0 20px var(--accent); } }
    </style>
</head>
<body>

    <!-- ロビー -->
    <div id="lobby" style="display: flex;">
        <div class="box">
            <h1 style="letter-spacing: 5px; color: var(--accent); font-size: 2.5rem; margin-bottom: 10px;">World War III</h1>
            <div id="lobby-setup">
                <button class="primary-btn" onclick="game.setLobbyMode('solo')" style="margin-bottom:15px;">一人で遊ぶ (AI対戦)</button>
                <button class="primary-btn" onclick="game.setLobbyMode('team')" style="background:var(--success)">友達と遊ぶ (マルチプレイ)</button>
                <div id="multi-setup" style="display:none; margin-top:20px; border-top:1px solid var(--border-color); padding-top:20px;">
                    <input type="text" id="room-id" placeholder="部屋名を入力">
                    <button class="primary-btn" onclick="hostRoom()">部屋を作成</button>
                    <button class="primary-btn" onclick="joinRoom()" style="background:#4b5563">既存の部屋に参加</button>
                </div>
            </div>
            <div id="lobby-wait" style="display:none">
                <p id="room-display" style="color:var(--accent); font-weight:bold; font-size: 1.4rem;"></p>
                <div id="player-list" style="text-align:left; font-size:14px; margin:15px 0; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid var(--border-color);"></div>
                <button id="multi-init-map-btn" class="primary-btn" onclick="game.initAndShowMap()" style="display:none; background:var(--success)">世界を生成（国選択へ）</button>
                <small id="wait-msg" style="color: var(--gold); font-weight: bold;">通信待機中...</small>
            </div>
        </div>
    </div>

    <!-- リザルト画面 -->
    <div id="result-overlay" style="display:none">
        <div class="box">
            <h1 style="color:var(--gold); margin-top:0; font-size: 2rem;">最終結果発表</h1>
            <div id="ranking-list"></div>
            <button class="primary-btn" onclick="location.reload()" style="margin-top:20px; background:var(--danger)">ホーム画面に戻る</button>
        </div>
    </div>

    <!-- 汎用モーダル -->
    <div id="generic-modal" style="display:none">
        <div class="box">
            <h3 id="modal-text">-</h3>
            <div id="modal-timer" style="font-size:3rem; color:var(--danger); font-weight:bold;">20</div>
            <div id="modal-options" style="display:flex; gap:12px; margin-top:20px;">
                <button id="modal-yes" class="primary-btn" style="background:var(--success); flex:1;">承認</button>
                <button id="modal-no" class="primary-btn" style="background:var(--danger); flex:1;">拒否</button>
            </div>
        </div>
    </div>

    <!-- サイドバーUI -->
    <div id="sidebar" style="display: none;">
        <div class="info-card">
            <h2 style="font-size: 1.2rem; margin: 0 0 10px 0; color: var(--accent); border-bottom: 2px solid var(--accent); display: inline-block;">World War III</h2>
            <h4 id="turn-display" style="color:var(--accent); margin:0">待機中</h4>
            <p id="my-info" style="font-size:12px; margin:5px 0 0; opacity:0.9"></p>
        </div>
        <div class="info-card"><div id="score-board"></div></div>
        <div class="info-card" id="detail-panel">
            <div id="det-name" style="font-size: 1.1rem; font-weight: bold; color: var(--accent);">国を選択</div>
            <div id="det-stats" style="font-size: 13px; margin-top: 8px; line-height: 1.6;">
                所有者: <span id="det-owner">-</span><br>
                総戦力: <span id="det-power" style="color:var(--danger); font-weight: bold;">-</span> / 
                総資金: <span id="det-cash" style="color:var(--gold); font-weight: bold;">-</span>
            </div>
        </div>
        <div id="actions" class="info-card" style="display:none">
            <div style="display:flex; gap:6px; margin-bottom:10px;">
                <input type="number" id="act-amount" value="20" min="10" step="10" style="margin:0; font-size:13px; height:38px;">
                <button onclick="game.handleActionRequest('plus_max')" style="background:var(--success); margin:0; width:110px; height:38px; border:none; border-radius:6px; cursor:pointer; color:white; font-weight:bold; font-size: 12px;">軍拡(全額)</button>
            </div>
            <div class="action-grid">
                <button onclick="game.handleActionRequest('war')">戦争(総力戦)</button>
                <button onclick="game.handleActionRequest('tax')" id="tax-btn">徴税</button>
                <button onclick="game.handleActionRequest('alliance')">同盟申請</button>
                <button onclick="game.handleActionRequest('trade')">交易申請</button>
                <button class="break-btn" onclick="game.handleActionRequest('break_alliance')">同盟破棄</button>
                <button onclick="game.handleActionRequest('end')" style="background:#000">ターン終了</button>
            </div>
            <div id="host-round-actions" style="display:none; margin-top:10px;">
                <button id="next-round-btn" class="primary-btn" onclick="game.nextRound()" style="background:var(--accent); width:100%;">次のラウンドを開始</button>
            </div>
        </div>
        <div class="log-chat-container">
            <div id="game-log" class="scroll-box"></div>
            <div id="chat-box" class="scroll-box"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" placeholder="メッセージ..." style="margin:0; font-size:13px; height:36px;">
                <button onclick="game.sendChat()" style="width:50px; margin:0; background:var(--accent); border:none; border-radius:6px; color:white; cursor:pointer; font-weight: bold;">送</button>
            </div>
        </div>
    </div>

    <!-- メイン -->
    <div id="main" style="display: none;">
        <div id="grid-container">
            <div id="grid"></div>
        </div>
        <div id="selection-panel" style="display:none">
            <h3 id="selection-msg" style="margin-bottom: 5px;">担当する主要国を選んでください</h3>
            <div id="country-btn-list" class="country-btn-list"></div>
            <div id="multi-start-controls" style="margin-top:20px; display:none;">
                <button id="multiplay-start-btn" class="primary-btn" onclick="game.multiplayStart()" style="background:var(--success); max-width:300px;">対戦を開始する</button>
            </div>
        </div>
    </div>

<script>
    const peerConfig = {
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
                { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" }
            ]
        }
    };

    const MAJORS = [
        { id: 'uk', name: 'イギリス', short: '英国', color: '#006400', power: 10, cash: 30 },
        { id: 'fr', name: 'フランス', short: '仏国', color: '#b8860b', power: 10, cash: 30 },
        { id: 'de', name: 'ドイツ', short: '独国', color: '#00008b', power: 10, cash: 30 },
        { id: 'ni', name: '日本', short: '日本', color: '#8b0000', power: 10, cash: 30 },
        { id: 'ca', name: 'カナダ', short: '加国', color: '#4b0082', power: 10, cash: 30 }
    ];
    const SUPERS = [
        { id: 'us', name: 'アメリカ', short: '米国', color: '#000000', power: 300, cash: 900 },
        { id: 'cn', name: '中国', short: '中国', color: '#000000', power: 300, cash: 900 },
        { id: 'ru', name: 'ロシア', short: '露国', color: '#000000', power: 300, cash: 900 },
        { id: 'in', name: 'インド', short: '印国', color: '#000000', power: 300, cash: 900 },
        { id: 'br', name: 'ブラジル', short: '伯国', color: '#000000', power: 300, cash: 900 }
    ];
    const MIDDLES = ["オーストラリア", "韓国", "イタリア", "スペイン", "メキシコ", "インドネシア", "トルコ", "サウジアラビア", "南アフリカ", "アルゼンチン", "オランダ", "スイス", "スウェーデン", "ポーランド", "タイ", "マレーシア", "フィリピン", "エジプト", "パキスタン", "ナイジェリア", "イラン", "コロンビア", "ベトナム", "チリ", "カザフスタン"]
        .map((n, i) => ({ id: `m${i}`, name: n, short: n.slice(0, 2), color: '#334155', power: 50, cash: 150 }));
    const SMALLS = ["ニュージーランド", "シンガポール", "アイルランド", "ノルウェー", "デンマーク", "フィンランド", "ベルギー", "オーストリア", "ポルトガル", "ギリシャ", "イスラエル", "チェコ", "ハンガリー", "ルーマニア", "ブルガリア", "スロバキア", "クロアチア", "リトアニア", "ラトビア", "エストニア", "アイスランド", "ルクセンブルク", "モナコ", "リヒテンシュタイン", "アンドラ", "サンマリノ", "ブータン", "モルディブ", "フィジー", "ブルネイ", "バーレーン", "カタール", "オマーン", "ウルグアイ", "パラグアイ", "エクアドル", "ジャマイカ", "トリニダード・トバゴ", "バハマ", "キプロス", "スロベニア", "コスタリカ", "パナマ", "クウェート", "マルタ", "モーリシャス"]
        .map((n, i) => ({ id: `s${i}`, name: n, short: n.slice(0, 2), color: '#64748b', power: 10, cash: 30 }));

    class GameCore {
        constructor() {
            this.resetData();
            this.peer = null; this.conns = {}; this.myPeerId = null; this.isHost = false; 
            this.selectedIdx = null; this.hostId = null; this.myCountryId = null;
            this.lobbyMode = '';
            console.log('World War III: システム起動');
        }

        resetData() {
            this.state = { 
                phase: 'lobby',
                grid: [], turnIdx: 0, players: {}, taxUsed: {}, alliances: [], isStarted: false, winner: null, 
                scores: { uk: 0, fr: 0, de: 0, ni: 0, ca: 0 }, 
                maxLands: { uk: 0, fr: 0, de: 0, ni: 0, ca: 0 },
                warCooldown: { uk: 0, fr: 0, de: 0, ni: 0, ca: 0 },
                round: 1, logs: [], chatLogs: [], countrySelectionDone: false
            };
        }

        // 重要：UI表示一括管理
        updateUIVisibility() {
            const phase = this.state.phase;
            const lobbyEl = document.getElementById('lobby');
            const mainEl = document.getElementById('main');
            const sidebarEl = document.getElementById('sidebar');
            const selectionEl = document.getElementById('selection-panel');
            const actionsEl = document.getElementById('actions');

            if (lobbyEl) lobbyEl.style.display = (phase === 'lobby') ? 'flex' : 'none';
            if (mainEl) mainEl.style.display = (phase === 'lobby') ? 'none' : 'flex';
            if (sidebarEl) sidebarEl.style.display = (phase === 'lobby') ? 'none' : 'flex';
            if (selectionEl) selectionEl.style.display = (phase === 'country_select') ? 'block' : 'none';
            if (actionsEl) actionsEl.style.display = (phase === 'playing') ? 'block' : 'none';
        }

        // 復元メソッド 1: renderCountryList
        renderCountryList() {
            const list = document.getElementById('country-btn-list');
            if (!list) return;
            list.innerHTML = '';
            MAJORS.forEach(m => {
                const takenPeer = Object.keys(this.state.players).find(p => this.state.players[p] === m.id);
                const btn = document.createElement('div');
                btn.className = 'country-choice' + (takenPeer ? ' taken' : '') + (this.myCountryId === m.id ? ' active' : '');
                btn.style.background = m.color; 
                btn.textContent = m.name + (takenPeer ? " (済)" : "");
                if (!takenPeer) {
                    btn.onclick = () => {
                        this.selectCountry(m.id);
                    };
                }
                list.appendChild(btn);
            });
        }

        // 復元メソッド 2: canIMove
        canIMove() {
            const myAssignedId = this.state.players[this.myPeerId || 'host'];
            const currentTurnId = MAJORS[this.state.turnIdx].id;
            return this.state.phase === 'playing' && !this.state.winner && myAssignedId === currentTurnId;
        }

        // 復元メソッド 3: isAlly
        isAlly(id1, id2) {
            if (!this.state.alliances) return false;
            return this.state.alliances.some(pair => (pair.includes(id1) && pair.includes(id2)));
        }

        setLobbyMode(mode) {
            this.lobbyMode = mode;
            if (mode === 'solo') {
                this.isHost = true;
                this.initMap();
                this.state.phase = 'country_select';
            } else {
                const ms = document.getElementById('multi-setup');
                if (ms) ms.style.display = 'block';
            }
            this.updateUIVisibility();
            this.updateUI();
        }

        initAndShowMap() {
            if (this.isHost) {
                this.initMap();
                this.state.phase = 'country_select';
                this.broadcast();
            }
        }

        selectCountry(majorId) {
            console.log('国選択: ' + majorId);
            const pId = this.myPeerId || 'host';
            if (Object.values(this.state.players).includes(majorId)) return;

            if (this.lobbyMode === 'solo') {
                this.state.players[pId] = majorId;
                this.state.phase = 'playing';
                this.state.isStarted = true;
                this.state.countrySelectionDone = true;
                this.myCountryId = majorId;
                console.log('ゲーム開始処理を実行(ソロ)');
                this.addLog(`開戦：担当は ${MAJORS.find(m=>m.id===majorId).name} です。`);
                this.checkAIStart();
            } else if (this.isHost) {
                this.state.players[pId] = majorId;
                this.myCountryId = majorId;
                this.broadcast();
            } else {
                this.myCountryId = majorId;
                if (this.conns[this.hostId]) this.conns[this.hostId].send({ type: 'select_country', peerId: pId, countryId: majorId });
            }
            this.updateUI();
        }

        multiplayStart() {
            if (!this.isHost) return;
            console.log('ゲーム開始処理を実行(マルチ)');
            this.state.phase = 'playing';
            this.state.isStarted = true;
            this.state.countrySelectionDone = true;
            this.state.turnIdx = 0;
            this.addLog("全プレイヤー配備完了。World War III 開戦。");
            this.broadcast();
            this.checkAIStart();
        }

        checkAIStart() {
            if (!this.isHost) return;
            const firstId = MAJORS[0].id;
            const isHuman = Object.values(this.state.players).includes(firstId);
            if (!isHuman) {
                console.log('初手AIを実行');
                setTimeout(() => this.runAI(firstId), 1500);
            }
        }

        initMap() {
            const all = [...MAJORS, ...SUPERS, ...MIDDLES, ...SMALLS]; // 81 countries
            const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } };
            shuffle(all);
            this.state.grid = Array(96).fill(null).map((_, i) => {
                const x = i % 12, y = Math.floor(i / 12);
                const isMainland = (x <= 7);
                const isIsland = (x >= 9 && x <= 11 && y <= 2);
                const isPeninsula = (x >= 8 && x <= 9 && y >= 4);
                if (isMainland || isIsland || isPeninsula) {
                    const c = all.pop();
                    return { ...c, ownerId: c.id, pos: i, power: c.power, cash: c.cash };
                }
                return { isSea: true, pos: i };
            });
            MAJORS.forEach(m => { 
                this.state.taxUsed[m.id] = 0; 
                this.state.warCooldown[m.id] = 0; 
            });
            this.state.turnIdx = 0; this.state.winner = null; this.state.alliances = [];
        }

        nextRound() {
            if (!this.isHost) return;
            this.state.round++; 
            this.initMap();
            this.state.phase = 'playing';
            this.state.isStarted = true;
            this.addLog(`第 ${this.state.round} ラウンド開始。`);
            this.broadcast();
            this.checkAIStart();
        }

        broadcast() {
            if (!this.isHost || !this.state) return;
            MAJORS.forEach(m => {
                const count = this.state.grid.filter(c => c && !c.isSea && c.ownerId === m.id).length;
                if (count > this.state.maxLands[m.id]) this.state.maxLands[m.id] = count;
            });
            Object.values(this.conns).forEach(c => c.send({ type: 'sync', state: this.state }));
            this.updateUIVisibility();
            this.updateUI();
        }

        addLog(msg) { if (this.isHost) { this.state.logs.push(msg); if (this.state.logs.length > 50) this.state.logs.shift(); } }
        addChat(msg) { if (this.isHost) { this.state.chatLogs.push(msg); if (this.state.chatLogs.length > 50) this.state.chatLogs.shift(); } }

        sendChat() {
            const input = document.getElementById('chat-input');
            const txt = input.value ? input.value.trim() : "";
            if (!txt) return;
            const sender = MAJORS.find(m => m.id === this.myCountryId)?.name || '観戦者';
            if (this.isHost) { this.addChat(`${sender}: ${txt}`); this.broadcast(); }
            else { if(this.conns[this.hostId]) this.conns[this.hostId].send({ type: 'chat', msg: `${sender}: ${txt}` }); }
            input.value = '';
        }

        handleActionRequest(type) {
            if (!this.canIMove()) return;
            const myId = this.state.players[this.myPeerId || 'host'];
            const amount = parseInt(document.getElementById('act-amount').value) || 20;
            if (this.isHost) this.applyAction(myId, type, this.selectedIdx, amount);
            else { if(this.conns[this.hostId]) this.conns[this.hostId].send({ type: 'action', actorId: myId, actType: type, targetIdx: this.selectedIdx, amount }); }
        }

        getMajorBaseCell(majorId) { return this.state.grid.find(c => c && !c.isSea && c.id === majorId); }

        applyAction(actorId, type, targetIdx, amount) {
            if (!this.isHost || this.state.winner) return;
            const actorBase = this.getMajorBaseCell(actorId);
            const myCells = this.state.grid.filter(c => c && !c.isSea && c.ownerId === actorId);
            let logMsg = "";

            switch(type) {
                case 'war':
                    if (targetIdx === null) break;
                    const targetCell = this.state.grid[targetIdx];
                    if (!targetCell || targetCell.isSea || targetCell.ownerId === actorId || this.isAlly(actorId, targetCell.ownerId)) break;
                    if (!this.isAdj(myCells.map(c => c.pos), targetIdx)) break;
                    const isMajor = MAJORS.some(m => m.id === targetCell.ownerId);
                    const enemyPower = isMajor ? this.getMajorBaseCell(targetCell.ownerId).power : (SUPERS.some(s=>s.id===targetCell.ownerId) ? SUPERS.find(s=>s.id===targetCell.ownerId).power : targetCell.power);
                    if (actorBase.power > enemyPower) {
                        actorBase.power -= enemyPower;
                        const enemyBase = isMajor ? this.getMajorBaseCell(targetCell.ownerId) : targetCell;
                        actorBase.cash += enemyBase.cash;
                        if (isMajor) {
                            logMsg = `⚠️ ${actorBase.name}が${enemyBase.name}を制圧！`;
                            const targetOwnerId = targetCell.ownerId;
                            this.state.grid.forEach(c => { if(c && !c.isSea && c.ownerId === targetOwnerId) c.ownerId = actorId; });
                            enemyBase.power = 0; enemyBase.cash = 0;
                        } else { logMsg = `${actorBase.name}が${targetCell.name}を制圧。`; targetCell.ownerId = actorId; }
                        if (!Object.values(this.state.players).includes(actorId)) this.state.warCooldown[actorId] = 3;
                        this.checkRoundVictory();
                    } else { logMsg = `${actorBase.name}の侵攻は失敗。`; }
                    break;
                case 'tax':
                    if (this.state.taxUsed[actorId] < 5) {
                        const gain = myCells.length * 20; actorBase.cash += gain; this.state.taxUsed[actorId]++;
                        logMsg = `${actorBase.name}が徴税を実施。`;
                    } break;
                case 'plus_max':
                    const pMax = Math.floor(actorBase.cash / 2);
                    if (pMax > 0) { actorBase.cash -= pMax * 2; actorBase.power += pMax; logMsg = `${actorBase.name}が限界軍拡。`; }
                    break;
                case 'alliance':
                    if (targetIdx === null) break;
                    const tid = this.state.grid[targetIdx].ownerId;
                    if (MAJORS.some(m => m.id === tid) && tid !== actorId) {
                        const targetPeer = Object.keys(this.state.players).find(key => this.state.players[key] === tid);
                        if (targetPeer && targetPeer !== 'host' && targetPeer !== this.myPeerId) {
                            this.conns[targetPeer].send({ type: 'modal_request', modalType: 'alliance', fromId: actorId }); return; 
                        } else { this.state.alliances.push([actorId, tid]); logMsg = `🤝 ${actorBase.name}と${MAJORS.find(m=>m.id===tid).name}が同盟。`; }
                    } break;
                case 'alliance_ok': this.state.alliances.push([actorId, targetIdx]); this.addLog(`🤝 ${actorBase.name}と同盟成立！`); this.nextTurn(); return;
                case 'alliance_ng': this.addLog(`💔 同盟申請は拒絶。`); this.nextTurn(); return;
                case 'trade_req':
                    const tOwnId = this.state.grid[targetIdx].ownerId;
                    const tPeer = Object.keys(this.state.players).find(k => this.state.players[k] === tOwnId);
                    if (tPeer && tPeer !== 'host' && tPeer !== this.myPeerId) { this.conns[tPeer].send({ type: 'modal_request', modalType: 'trade_1', fromId: actorId, amount }); return; }
                    break;
                case 'trade_final':
                    const aB = this.getMajorBaseCell(actorId); const bB = this.getMajorBaseCell(targetIdx); const tC = this.state.grid[amount];
                    if (aB.cash >= targetIdx) { aB.cash -= targetIdx; bB.cash += targetIdx; tC.ownerId = bB.id; logMsg = `💰 交易成立：${aB.name}の領土を${bB.name}が取得。`; }
                    break;
                case 'break_alliance':
                    if (targetIdx === null) break;
                    const b_tid = this.state.grid[targetIdx].ownerId;
                    if (this.isAlly(actorId, b_tid)) { this.state.alliances = this.state.alliances.filter(p => !(p.includes(actorId) && p.includes(b_tid))); logMsg = `⚠️ ${actorBase.name}が同盟破棄。`; }
                    break;
                case 'end': logMsg = `${actorBase.name}はターン終了。`; break;
            }
            if (logMsg) this.addLog(logMsg);
            this.nextTurn();
        }

        isAdj(myPosList, targetIdx) {
            const tx = targetIdx % 12, ty = Math.floor(targetIdx / 12);
            return myPosList.some(p => {
                const mx = p % 12, my = Math.floor(p / 12);
                if (Math.abs(mx - tx) + Math.abs(my - ty) === 1) return true;
                if (mx === 7 && tx === 9 && my === ty && my <= 2) return true;
                if (mx === 9 && tx === 7 && my === ty && my <= 2) return true;
                if (mx === 7 && tx === 8 && my === ty && my >= 4) return true;
                if (mx === 8 && tx === 7 && my === ty && my >= 4) return true;
                return false;
            });
        }

        showModal(type, fromId, amount = 0, cellIdx = 0) {
            const modal = document.getElementById('generic-modal'); 
            const timerEl = document.getElementById('modal-timer');
            if(!modal) return;
            modal.style.display = 'flex';
            let timeLeft = 20; timerEl.textContent = timeLeft;
            if (type === 'alliance') document.getElementById('modal-text').textContent = `${MAJORS.find(m=>m.id===fromId).name}から同盟申請`;
            else if (type === 'trade_1') document.getElementById('modal-text').textContent = `${MAJORS.find(m=>m.id===fromId).name}から交易：資金${amount}と引換に領土を譲りますか？`;
            this.modalTimer = setInterval(() => {
                timeLeft--; timerEl.textContent = timeLeft;
                if (timeLeft <= 0) this.closeModal(false, type, fromId, amount, cellIdx);
            }, 1000);
            document.getElementById('modal-yes').onclick = () => this.closeModal(true, type, fromId, amount, cellIdx);
            document.getElementById('modal-no').onclick = () => this.closeModal(false, type, fromId, amount, cellIdx);
        }

        closeModal(agreed, type, fromId, amount, cellIdx) {
            clearInterval(this.modalTimer); document.getElementById('generic-modal').style.display = 'none';
            if (type === 'alliance') {
                const ans = agreed ? 'alliance_ok' : 'alliance_ng';
                if (this.isHost) this.applyAction(fromId, ans, this.myCountryId, 0);
                else if(this.conns[this.hostId]) this.conns[this.hostId].send({ type: 'alliance_answer', fromId, toId: this.myCountryId, agreed });
            } else if (type === 'trade_1') {
                if (agreed) { this.isSelectingLandForTrade = true; this.tradeContext = { fromId, amount }; this.updateUI(); }
                else { if (this.isHost) { this.addLog("交易拒否"); this.nextTurn(); } else if(this.conns[this.hostId]) this.conns[this.hostId].send({ type: 'chat', msg: "交易拒否" }); }
            }
        }

        nextTurn() {
            if (!this.isHost) return;
            if (this.state.winner) { this.broadcast(); return; }
            this.state.turnIdx = (this.state.turnIdx + 1) % 5;
            const nextId = MAJORS[this.state.turnIdx].id;
            if (!this.state.grid.some(c => c && !c.isSea && c.ownerId === nextId)) return this.nextTurn();
            this.broadcast();
            if (!Object.values(this.state.players).includes(nextId)) setTimeout(() => this.runAI(nextId), 1200);
        }

        runAI(id) {
            if (!this.isHost) return;
            if (!this.state.warCooldown) this.state.warCooldown = {};
            if (this.state.warCooldown[id] === undefined) this.state.warCooldown[id] = 0;
            if (!this.state.taxUsed) this.state.taxUsed = {};
            if (this.state.taxUsed[id] === undefined) this.state.taxUsed[id] = 0;
            const actorBase = this.getMajorBaseCell(id); if (!actorBase) { this.nextTurn(); return; }
            const myCells = this.state.grid.filter(c => c && !c.isSea && c.ownerId === id);
            if (this.state.warCooldown[id] > 0) { this.state.warCooldown[id]--; } 
            else {
                let bestT = null; let minP = Infinity;
                myCells.forEach(mc => {
                    const x = mc.pos % 12, y = Math.floor(mc.pos / 12);
                    [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx, dy]) => {
                        const nx = x+dx, ny = y+dy;
                        if(nx>=0 && nx<12 && ny>=0 && ny<8) {
                            const t = this.state.grid[ny*12+nx];
                            if(t && !t.isSea && t.ownerId !== id && !this.isAlly(id, t.ownerId)) {
                                const p = MAJORS.some(m => m.id === t.ownerId) ? this.getMajorBaseCell(t.ownerId).power : (SUPERS.some(s=>s.id===t.ownerId) ? SUPERS.find(s=>s.id===t.ownerId).power : t.power);
                                if (actorBase.power > p && p < minP) { minP = p; bestT = ny*12+nx; }
                            }
                        }
                    });
                });
                if (bestT !== null) return this.applyAction(id, 'war', bestT, 0);
            }
            if (actorBase.cash >= 20) return this.applyAction(id, 'plus_max', null, 0);
            this.applyAction(id, 'end', null, 0);
        }

        checkRoundVictory() {
            const alive = MAJORS.filter(m => this.state.grid.some(c => c && !c.isSea && c.ownerId === m.id));
            if (alive.length === 1) {
                const win = alive[0]; this.state.winner = win.name; this.state.scores[win.id]++;
                this.addLog(`第 ${this.state.round} ラウンド覇者：${win.name}`);
                if (this.state.scores[win.id] >= 2) this.showFinalResult();
            }
        }

        showFinalResult() {
            const ranking = MAJORS.map(m => ({ name: m.name, score: this.state.scores[m.id], lands: this.state.maxLands[m.id] })).sort((a, b) => b.score - a.score || b.lands - a.lands);
            const list = document.getElementById('ranking-list'); if(list) list.innerHTML = "";
            ranking.slice(0, 3).forEach((r, i) => {
                const colors = ['var(--gold)', 'var(--silver)', 'var(--bronze)'];
                list.innerHTML += `<div class="rank-item" style="background:${colors[i]}"><span>${i+1}位: ${r.name}</span><span>${r.score}勝</span></div>`;
            });
            document.getElementById('result-overlay').style.display = 'flex';
        }

        updateUI() {
            if (!this.state) return;
            this.updateUIVisibility();

            if (this.state.phase === 'country_select') {
                this.renderCountryList();
                const msc = document.getElementById('multi-start-controls');
                if (msc) msc.style.display = (this.lobbyMode === 'host') ? 'block' : 'none';
            }

            const gridEl = document.getElementById('grid'); if(!gridEl) return;
            gridEl.innerHTML = '';
            const activeId = MAJORS[this.state.turnIdx].id;
            this.state.grid.forEach((cell, i) => {
                const div = document.createElement('div'); div.className = 'cell';
                if (cell.isSea) div.classList.add('sea');
                else {
                    if (this.selectedIdx === i) div.classList.add('selected');
                    if (this.isSelectingLandForTrade && cell.ownerId === this.tradeContext.fromId) div.classList.add('trade-target');
                    if (cell.ownerId === activeId && this.state.phase === 'playing' && !this.state.winner) div.classList.add('current-turn-glow');
                    const currentOwner = MAJORS.find(m => m.id === cell.ownerId);
                    const isSuper = SUPERS.some(s => s.id === cell.ownerId);
                    if (currentOwner) div.style.background = currentOwner.color;
                    else if (isSuper) div.style.background = 'var(--super-bg)';
                    else div.style.background = cell.id.startsWith('m') ? 'var(--mid-bg)' : 'var(--small-bg)';
                    div.innerHTML = `<span>${currentOwner ? currentOwner.short : cell.short}</span>`;
                    if (this.isAlly(activeId, cell.ownerId)) div.innerHTML += `<span class="ally-mark">🤝</span>`;
                    div.onclick = () => {
                        if (this.isSelectingLandForTrade) {
                            if (cell.ownerId === this.tradeContext.fromId) {
                                this.isSelectingLandForTrade = false;
                                if (this.isHost) this.applyAction(this.myCountryId, 'trade_final', this.tradeContext.fromId, i);
                                else if(this.conns[this.hostId]) this.conns[this.hostId].send({ type: 'action', actorId: this.myCountryId, actType: 'trade_final', targetIdx: this.tradeContext.fromId, amount: i });
                            } else alert("相手の領土を選んで！");
                            return;
                        }
                        this.selectedIdx = i; this.updateUI();
                    };
                }
                gridEl.appendChild(div);
            });

            if (this.selectedIdx !== null) {
                const c = this.state.grid[this.selectedIdx]; 
                if (c && !c.isSea) {
                    const stats = MAJORS.some(m => m.id === c.ownerId) ? this.getMajorBaseCell(c.ownerId) : (SUPERS.some(s=>s.id===c.ownerId) ? SUPERS.find(s=>s.id===c.ownerId) : c);
                    const ownerName = MAJORS.find(m => m.id === c.ownerId)?.name || (SUPERS.some(s=>s.id===c.ownerId) ? SUPERS.find(s=>s.id===c.ownerId).name : "NPC");
                    document.getElementById('det-name').textContent = (c.id !== c.ownerId) ? `${ownerName}領 ${c.name}` : c.name;
                    document.getElementById('det-owner').textContent = ownerName;
                    document.getElementById('det-power').textContent = stats.power; document.getElementById('det-cash').textContent = stats.cash;
                }
            }

            document.getElementById('game-log').innerHTML = this.state.logs.slice().reverse().map(l => `<div>> ${l}</div>`).join('');
            document.getElementById('chat-box').innerHTML = this.state.chatLogs.slice().map(l => `<div>${l}</div>`).join('');
            const sb = document.getElementById('score-board'); if(sb) sb.innerHTML = '';
            MAJORS.forEach(m => { sb.innerHTML += `<div class="score-row"><span>${m.name}</span> <span>${this.state.scores[m.id]}勝 (${this.state.maxLands[m.id]}領)</span></div>`; });
            
            const display = document.getElementById('turn-display');
            if (this.state.winner) display.textContent = `勝利者：${this.state.winner}`;
            else if (this.state.phase === 'playing') display.textContent = `${MAJORS[this.state.turnIdx].name}の番`;
            else display.textContent = "国を選択中...";
            
            const myMid = this.state.players[this.myPeerId || 'host'];
            document.getElementById('my-info').textContent = `担当：${MAJORS.find(m => m.id === myMid)?.name || '未選択'}`;
            if (this.canIMove()) document.getElementById('tax-btn').textContent = `徴税(${5 - this.state.taxUsed[myMid]})`;
        }
    }

    const game = new GameCore();
    window.selectCountry = (id) => game.selectCountry(id);

    function hostRoom() {
        const rId = document.getElementById('room-id').value.trim(); if (!rId) return alert("部屋名入力");
        game.lobbyMode = 'host'; game.isHost = true; game.peer = new Peer(rId, peerConfig);
        game.peer.on('open', id => {
            game.myPeerId = id; document.getElementById('room-display').textContent = "部屋：" + id;
            document.getElementById('lobby-setup').style.display = 'none'; document.getElementById('lobby-wait').style.display = 'block';
            document.getElementById('multi-init-map-btn').style.display = 'block';
        });
        game.peer.on('connection', conn => {
            game.conns[conn.peer] = conn;
            conn.on('data', d => {
                if (d.type === 'select_country') { game.state.players[d.peerId] = d.countryId; game.broadcast(); }
                if (d.type === 'action') game.applyAction(d.actorId, d.actType, d.targetIdx, d.amount);
                if (d.type === 'alliance_answer') game.applyAction(d.fromId, d.agreed ? 'alliance_ok' : 'alliance_ng', d.toId, 0);
                if (d.type === 'chat') { game.addChat(d.msg); game.broadcast(); }
            });
            conn.on('open', () => { game.broadcast(); updateLobby(); });
        });
        game.peer.on('error', err => alert("通信エラー: " + err.type));
    }

    function joinRoom() {
        const rId = document.getElementById('room-id').value.trim(); if (!rId) return alert("部屋名入力");
        game.lobbyMode = 'guest'; game.isHost = false; game.hostId = rId; game.peer = new Peer(peerConfig);
        game.peer.on('open', id => {
            game.myPeerId = id; const conn = game.peer.connect(rId); game.conns[rId] = conn;
            conn.on('open', () => {
                document.getElementById('wait-msg').textContent = "接続成功！ホストの開始を待っています...";
                document.getElementById('wait-msg').style.color = "var(--success)";
            });
            conn.on('data', d => {
                if (d.type === 'sync') { game.state = d.state; game.updateUI(); }
                if (d.type === 'modal_request') game.showModal(d.modalType, d.fromId, d.amount, d.cellIdx);
            });
            document.getElementById('lobby-setup').style.display = 'none';
            document.getElementById('lobby-wait').style.display = 'block';
        });
        game.peer.on('error', err => alert("接続失敗: 部屋が見つからないか既に使用されています。"));
    }

    function updateLobby() {
        const list = document.getElementById('player-list'); if(!list) return;
        list.innerHTML = '<strong>参加中のプレイヤー:</strong>';
        Object.entries(game.state.players).forEach(([pid, mid]) => {
            list.innerHTML += `<div>・${MAJORS.find(m => m.id === mid).name}</div>`;
        });
    }

    window.onload = () => {
        game.state.phase = 'lobby';
        game.updateUIVisibility();
    };
</script>
