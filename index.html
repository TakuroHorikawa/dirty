<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORLD WAR SUPREMACY: 3-ROUND EDITION</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0c; --panel: #16161a; --border: #2a2a30; --text: #e0e0e6; --accent: #4f46e5;
            --ni: #8b0000; --de: #00008b; --uk: #006400; --fr: #b8860b; --ca: #4b0082;
        }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        @media (min-width: 900px) {
            body { flex-direction: row; }
            #sidebar { width: 340px; height: 100vh; position: sticky; top: 0; overflow-y: auto; border-right: 1px solid var(--border); }
            #main { flex: 1; padding: 20px; }
        }
        @media (max-width: 899px) {
            #sidebar { width: 100%; border-bottom: 1px solid var(--border); padding: 10px; box-sizing: border-box; }
            #main { width: 100%; padding: 10px; box-sizing: border-box; }
        }

        #lobby { position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .lobby-box { background: var(--panel); padding: 30px; border-radius: 12px; border: 1px solid var(--border); width: 90%; max-width: 400px; text-align: center; }

        input { background: #000; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        button { width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; background: var(--accent); color: white; margin-bottom: 4px; font-size: 13px; }
        button:hover:not(:disabled) { filter: brightness(1.2); }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        #grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; width: 100%; max-width: 900px; margin: 0 auto; aspect-ratio: 9/6; }
        .cell { aspect-ratio: 1; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: clamp(9px, 2vw, 14px); font-weight: bold; cursor: pointer; transition: 0.1s; position: relative; border: 1px solid rgba(255,255,255,0.05); }
        .cell:hover { border-color: #fff; z-index: 5; transform: scale(1.02); }
        .cell.selected { border: 2px solid #fff; box-shadow: 0 0 15px var(--accent); z-index: 10; }
        .ally-mark { position: absolute; top: 1px; right: 1px; font-size: 12px; }

        .info-card { background: var(--panel); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border); }
        .log-box { height: 160px; overflow-y: auto; font-size: 11px; background: #000; padding: 10px; border-radius: 6px; border: 1px solid var(--border); display: flex; flex-direction: column-reverse; }
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        
        .score-row { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; border-bottom: 1px solid #222; }
        .flex-row { display: flex; gap: 5px; align-items: center; margin-bottom: 5px; }
        .flex-row input { margin-bottom: 0; text-align: center; font-size: 12px; }
        .current-turn-glow { animation: glow 1.5s infinite alternate; }
        @keyframes glow { from { box-shadow: 0 0 2px #fff; } to { box-shadow: 0 0 15px var(--accent); } }
    </style>
</head>
<body>

    <div id="lobby">
        <div class="lobby-box">
            <h2 style="margin:0">WORLD WAR SUPREMACY</h2>
            <div id="lobby-setup">
                <input type="text" id="room-id" placeholder="独自の部屋名を入力">
                <button onclick="hostRoom()">部屋を作る</button>
                <button onclick="joinRoom()" style="background:#333">参加する</button>
            </div>
            <div id="lobby-wait" style="display:none">
                <p id="room-display" style="color:var(--accent); font-weight:bold;"></p>
                <div id="player-list" style="text-align:left; font-size:13px; margin-bottom:15px"></div>
                <button id="start-btn" onclick="game.start()" style="display:none; background:#10b981">ゲーム開始 (AI補充)</button>
                <small id="wait-msg">準備中...</small>
            </div>
        </div>
    </div>

    <div id="sidebar">
        <div class="info-card">
            <h3 id="turn-display" style="color:var(--accent); margin:0">待機中</h3>
            <p id="my-info" style="font-size:13px; margin:5px 0 0; opacity:0.7"></p>
        </div>

        <div class="info-card">
            <div style="font-size: 11px; font-weight: bold; margin-bottom: 5px;">現在の勝利数 (3勝先取)</div>
            <div id="score-board"></div>
        </div>

        <div class="info-card" id="detail-panel">
            <div id="det-name" style="font-size: 1.1rem; font-weight: bold;">国を選択</div>
            <div id="det-stats" style="font-size: 13px; margin-top: 8px; line-height: 1.5;">
                所有者: <span id="det-owner">-</span><br>
                総戦力: <span id="det-power">-</span><br>
                総資金: <span id="det-cash">-</span>
            </div>
        </div>

        <div class="info-card" id="actions" style="display:none">
            <div class="flex-row">
                <span style="font-size:11px;">軍事量設定:</span>
                <input type="number" id="act-amount" value="20" min="10" step="10">
            </div>
            <div class="action-grid" id="normal-actions">
                <button onclick="game.handleActionRequest('war')">戦争(総力戦)</button>
                <button onclick="game.handleActionRequest('tax')" id="tax-btn">徴税</button>
                <button onclick="game.handleActionRequest('plus')">軍拡(+N)</button>
                <button onclick="game.handleActionRequest('minus')">軍縮(-N)</button>
                <button onclick="game.handleActionRequest('plus_max')" style="background:#2ecc71">軍拡(最大)</button>
                <button onclick="game.handleActionRequest('minus_max')" style="background:#e67e22">軍縮(最大)</button>
                <button onclick="game.handleActionRequest('alliance')">同盟申請</button>
                <button onclick="game.handleActionRequest('requestAid')">援助要請</button>
                <button onclick="game.handleActionRequest('end')" style="grid-column: span 2; background:#333">ターンエンド</button>
            </div>
            <div id="host-round-actions" style="display:none; margin-top:10px;">
                <button onclick="game.nextRound()" style="background:#4f46e5; height:50px;">次のラウンドを開始へ</button>
            </div>
        </div>

        <div class="info-card">
            <div class="log-box" id="game-log"></div>
        </div>
    </div>

    <div id="main">
        <div id="grid"></div>
    </div>

<script>
    const MAJORS = [
        { id: 'ni', name: '日本', short: '日本', color: '#8b0000', power: 10, cash: 30 },
        { id: 'de', name: 'ドイツ', short: 'ドイ', color: '#00008b', power: 10, cash: 30 },
        { id: 'uk', name: 'イギリス', short: 'イギ', color: '#006400', power: 10, cash: 30 },
        { id: 'fr', name: 'フランス', short: 'フラ', color: '#b8860b', power: 10, cash: 30 },
        { id: 'ca', name: 'カナダ', short: 'カナ', color: '#4b0082', power: 10, cash: 30 }
    ];
    const SUPERS = [
        { id: 'us', name: 'アメリカ', short: 'アメ', color: '#000', power: 500, cash: 1500 },
        { id: 'ru', name: 'ロシア', short: 'ロシ', color: '#000', power: 500, cash: 1500 },
        { id: 'cn', name: '中国', short: '中国', color: '#000', power: 500, cash: 1500 },
        { id: 'in', name: 'インド', short: 'イン', color: '#000', power: 500, cash: 1500 }
    ];
    const MIDDLE_COUNTRIES = ["インド", "韓国", "イタリア", "オーストラリア", "ブラジル", "インドネシア", "トルコ", "サウジアラビア", "メキシコ", "南アフリカ", "スペイン", "ポーランド", "オランダ", "イラン", "アルゼンチン"];
    const SMALL_NAMES = ["ルクセンブルク", "アイスランド", "エストニア", "ラトビア", "リトアニア", "スロバキア", "キプロス", "マルタ", "シンガポール", "ブルネイ", "ブータン", "モルティブ", "ラオス", "東ティモール", "フィジー", "サモア", "カタール", "バーレーン", "オマーン", "ボツワナ", "モーリシャス", "カーボベルデ", "セイシェル", "ジブチ", "ナミビア", "ウルグアイ", "コスタリカ", "ジャマイカ", "バルバドス", "バハマ"];

    class GameCore {
        constructor() {
            this.state = { 
                grid: [], turnIdx: 0, players: {}, taxUsed: {}, 
                alliances: [], isStarted: false, winner: null, 
                scores: { ni: 0, de: 0, uk: 0, fr: 0, ca: 0 },
                round: 1, finalWinner: null
            };
            this.peer = null; this.conns = {}; this.myPeerId = null; this.isHost = false; this.selectedIdx = null; this.hostId = null;
        }

        initMap() {
            const middle = MIDDLE_COUNTRIES.map((n, i) => ({ id: `m${i}`, name: n, short: n.slice(0, 2), color: '#333', power: 100, cash: 300 }));
            const small = SMALL_NAMES.map((n, i) => ({ id: `s${i}`, name: n, short: n.slice(0, 2), color: '#666', power: 10, cash: 30 }));
            const all = [...MAJORS, ...SUPERS, ...middle, ...small];
            const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } };
            do { shuffle(all); } while (!this.checkMap(all));
            this.state.grid = all.map((c, i) => ({ ...c, ownerId: c.id, pos: i, power: c.power, cash: c.cash }));
            MAJORS.forEach(m => this.state.taxUsed[m.id] = 0);
            this.state.alliances = [];
            this.state.winner = null;
        }

        checkMap(list) {
            const isP = (c) => MAJORS.concat(SUPERS).some(m => m.id === c.id);
            for (let i = 0; i < list.length; i++) {
                if (!isP(list[i])) continue;
                const x = i % 9, y = Math.floor(i / 9);
                for (let [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
                    const nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < 9 && ny >= 0 && ny < 6 && isP(list[ny * 9 + nx])) return false;
                }
            }
            return true;
        }

        start() {
            if (!this.isHost) return;
            this.initMap();
            this.state.isStarted = true;
            this.addLog(`【ラウンド ${this.state.round}】開始。`);
            this.broadcast();
        }

        nextRound() {
            if (!this.isHost) return;
            this.state.round++;
            this.initMap();
            this.addLog(`【ラウンド ${this.state.round}】を開始します。`);
            this.broadcast();
        }

        broadcast() {
            if (!this.isHost) return;
            Object.values(this.conns).forEach(c => c.send({ type: 'sync', state: this.state }));
            this.updateUI();
        }

        addLog(msg) {
            const log = document.getElementById('game-log');
            const d = document.createElement('div');
            d.textContent = `> ${msg}`;
            log.appendChild(d);
            log.scrollTop = log.scrollHeight;
        }

        handleActionRequest(type) {
            if (!this.canIMove()) return;
            const myId = this.state.players[this.myPeerId];
            const amount = parseInt(document.getElementById('act-amount').value) || 20;
            if (this.isHost) this.applyAction(myId, type, this.selectedIdx, amount);
            else this.conns[this.hostId].send({ type: 'action', actorId: myId, actType: type, targetIdx: this.selectedIdx, amount });
        }

        applyAction(actorId, type, targetIdx, amount) {
            if (!this.isHost) return;
            if (this.state.winner) return; // ラウンド終了後は操作不可

            const actor = this.state.grid.find(c => c.id === actorId);
            const myCells = this.state.grid.filter(c => c.ownerId === actorId);
            let logMsg = "";

            switch(type) {
                case 'war':
                    if (targetIdx === null) break;
                    const target = this.state.grid[targetIdx];
                    if (target.ownerId === actorId) break;
                    // 同盟国チェック
                    if (this.isAlly(actorId, target.ownerId)) { logMsg = "同盟国には攻撃できません！"; break; }
                    
                    const isAdj = myCells.some(mc => Math.abs((mc.pos % 9)-(target.pos % 9)) + Math.abs(Math.floor(mc.pos / 9)-Math.floor(target.pos / 9)) === 1);
                    if (!isAdj) break;

                    const targetOwnerId = target.ownerId;
                    const isMajorTarget = MAJORS.some(m => m.id === targetOwnerId);
                    const enemyPower = isMajorTarget ? this.state.grid.find(c => c.id === targetOwnerId).power : target.power;

                    if (actor.power > enemyPower) {
                        actor.power -= enemyPower;
                        const enemyCash = isMajorTarget ? this.state.grid.find(c => c.id === targetOwnerId).cash : target.cash;
                        actor.cash += enemyCash;
                        if (isMajorTarget) {
                            logMsg = `${actor.name}が${MAJORS.find(m=>m.id===targetOwnerId).name}を滅亡させ、全領土を併合！`;
                            this.state.grid.forEach(c => { if(c.ownerId === targetOwnerId) c.ownerId = actorId; });
                        } else {
                            logMsg = `${actor.name}が${target.name}を制圧。`;
                            target.ownerId = actorId;
                        }
                        this.checkRoundVictory();
                    } else { logMsg = `${actor.name}の侵攻は失敗。`; }
                    break;

                case 'tax':
                    if (this.state.taxUsed[actorId] < 5) {
                        const gain = myCells.length * 20;
                        actor.cash += gain; this.state.taxUsed[actorId]++;
                        logMsg = `${actor.name}が徴税を実施(+${gain})`;
                    } break;

                case 'plus':
                    if (actor.cash >= amount * 2) { actor.cash -= amount * 2; actor.power += amount; logMsg = `${actor.name}が軍拡を実施(+${amount})`; }
                    break;

                case 'plus_max':
                    const maxP = Math.floor(actor.cash / 2);
                    if (maxP > 0) { actor.cash -= maxP * 2; actor.power += maxP; logMsg = `${actor.name}が限界まで軍拡(+${maxP})`; }
                    break;

                case 'minus':
                    if (actor.power >= amount) { actor.power -= amount; actor.cash += amount * 2; logMsg = `${actor.name}が軍縮を実施(+${amount * 2})`; }
                    break;

                case 'minus_max':
                    const curP = actor.power;
                    if (curP > 0) { actor.power = 0; actor.cash += curP * 2; logMsg = `${actor.name}が全戦力を軍縮(+${curP * 2})`; }
                    break;

                case 'alliance':
                    if (targetIdx === null) break;
                    const tid = this.state.grid[targetIdx].ownerId;
                    if (MAJORS.some(m => m.id === tid) && tid !== actorId) {
                        if(Math.random() > 0.4) {
                            this.state.alliances.push([actorId, tid]);
                            logMsg = `${actor.name}と${MAJORS.find(m=>m.id===tid).name}が同盟。`;
                        } else { logMsg = `${MAJORS.find(m=>m.id===tid).name}は同盟を拒否。`; }
                    } break;

                case 'requestAid':
                    if (targetIdx === null) break;
                    const aidTo = this.state.grid[targetIdx].ownerId;
                    if (this.isAlly(actorId, aidTo)) {
                        const provider = this.state.grid.find(c => c.id === aidTo);
                        if (provider.cash >= 100) {
                            provider.cash -= 50; provider.power -= 20;
                            actor.cash += 50; actor.power += 20;
                            logMsg = `${actor.name}が援助を受けた。`;
                        } else { logMsg = `${provider.name}に余力なし。`; }
                    } break;

                case 'end': logMsg = `${actor.name}はターンを終了。`; break;
            }

            if (logMsg) this.addLog(logMsg);
            this.nextTurn();
        }

        nextTurn() {
            if (!this.isHost) return;
            if (this.state.winner) { this.broadcast(); return; }
            this.state.turnIdx = (this.state.turnIdx + 1) % 5;
            const nextId = MAJORS[this.state.turnIdx].id;
            if (!this.state.grid.some(c => c.ownerId === nextId)) return this.nextTurn();
            this.broadcast();
            const isHuman = Object.values(this.state.players).includes(nextId);
            if (!isHuman && !this.state.winner) setTimeout(() => this.runAI(nextId), 600);
        }

        runAI(id) {
            const actor = this.state.grid.find(c => c.id === id);
            const myCells = this.state.grid.filter(c => c.ownerId === id);

            // 優先1: 侵略（勝てる隣接国を全てチェックし、最も弱いところへ）
            // ※同盟国（isAlly）は絶対に除外する
            let bestTarget = null;
            let minPower = Infinity;

            myCells.forEach(mc => {
                const x = mc.pos % 9, y = Math.floor(mc.pos / 9);
                [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx, dy]) => {
                    const nx = x+dx, ny = y+dy;
                    if(nx>=0 && nx<9 && ny>=0 && ny<6) {
                        const t = this.state.grid[ny*9+nx];
                        // 条件: 自国でない かつ 同盟国でない
                        if(t.ownerId !== id && !this.isAlly(id, t.ownerId)) {
                            const isM = MAJORS.some(m => m.id === t.ownerId);
                            const p = isM ? this.state.grid.find(c => c.id === t.ownerId).power : t.power;
                            if (actor.power > p && p < minPower) {
                                minPower = p;
                                bestTarget = ny*9+nx;
                            }
                        }
                    }
                });
            });

            if (bestTarget !== null) return this.applyAction(id, 'war', bestTarget, 0);

            // 優先2: 軍拡（20以上あれば最大変換）
            if (actor.cash >= 20) return this.applyAction(id, 'plus_max', null, 0);

            // 優先3: 徴税（回数があれば）
            if (this.state.taxUsed[id] < 5) return this.applyAction(id, 'tax', null, 0);

            // 優先4: ターンエンド
            this.applyAction(id, 'end', null, 0);
        }

        checkRoundVictory() {
            const alive = MAJORS.filter(m => this.state.grid.some(c => c.ownerId === m.id));
            if (alive.length === 1) {
                const roundWinner = alive[0];
                this.state.winner = roundWinner.name;
                this.state.scores[roundWinner.id]++;
                this.addLog(`【ラウンド終結】勝者：${roundWinner.name}`);
                
                if (this.state.scores[roundWinner.id] >= 3) {
                    this.state.finalWinner = roundWinner.name;
                    this.addLog(`【完全決着】${roundWinner.name}が世界を制覇しました！`);
                }
            }
        }

        canIMove() { return this.state.isStarted && !this.state.winner && this.state.players[this.myPeerId] === MAJORS[this.state.turnIdx].id; }
        isAlly(id1, id2) { return this.state.alliances.some(a => (a[0] === id1 && a[1] === id2) || (a[0] === id2 && a[1] === id1)); }

        updateUI() {
            if (this.state.isStarted) document.getElementById('lobby').style.display = 'none';
            const gridEl = document.getElementById('grid'); gridEl.innerHTML = '';
            const activeId = MAJORS[this.state.turnIdx].id;

            this.state.grid.forEach((cell, i) => {
                const div = document.createElement('div'); div.className = 'cell';
                if (this.selectedIdx === i) div.classList.add('selected');
                if (cell.ownerId === activeId && !this.state.winner) div.classList.add('current-turn-glow');
                
                const owner = [...MAJORS, ...SUPERS, {id:'m', color:'#333'}, {id:'s', color:'#666'}].find(m => cell.ownerId.startsWith(m.id)) || {color:'#222'};
                div.style.background = owner.color || '#444';
                div.innerHTML = `<span>${cell.short}</span>`;
                if (this.isAlly(activeId, cell.ownerId)) div.innerHTML += `<span class="ally-mark">🤝</span>`;

                div.onclick = () => {
                    this.selectedIdx = i;
                    const isM = MAJORS.some(m => m.id === cell.ownerId);
                    const stats = isM ? this.state.grid.find(c => c.id === cell.ownerId) : cell;
                    document.getElementById('det-name').textContent = cell.name;
                    document.getElementById('det-owner').textContent = isM ? stats.name : "NPC";
                    document.getElementById('det-power').textContent = stats.power;
                    document.getElementById('det-cash').textContent = stats.cash;
                    this.updateUI();
                };
                gridEl.appendChild(div);
            });

            // スコアボード更新
            const sb = document.getElementById('score-board'); sb.innerHTML = '';
            MAJORS.forEach(m => {
                const row = document.createElement('div'); row.className = 'score-row';
                row.innerHTML = `<span>${m.name}</span> <span>${this.state.scores[m.id]} 勝</span>`;
                sb.appendChild(row);
            });

            const display = document.getElementById('turn-display');
            if (this.state.finalWinner) {
                display.textContent = `覇者：${this.state.finalWinner}`;
                display.style.color = "gold";
            } else if (this.state.winner) {
                display.textContent = `ラウンド覇者：${this.state.winner}`;
                display.style.color = "#2ecc71";
            } else {
                display.textContent = `${MAJORS[this.state.turnIdx].name}の番`;
                display.style.color = "var(--accent)";
            }

            const myMid = this.state.players[this.myPeerId];
            document.getElementById('my-info').textContent = `担当：${MAJORS.find(m => m.id === myMid)?.name || '観戦'}`;
            
            // アクションパネル表示制御
            const canControl = this.canIMove() && !this.state.winner;
            document.getElementById('normal-actions').style.display = canControl ? 'grid' : 'none';
            document.getElementById('actions').style.display = (canControl || (this.isHost && this.state.winner && !this.state.finalWinner)) ? 'block' : 'none';
            
            if (canControl) document.getElementById('tax-btn').textContent = `徴税(${5 - this.state.taxUsed[myMid]})`;
            
            // ホスト用 次のラウンドボタン
            const roundBtn = document.getElementById('host-round-actions');
            roundBtn.style.display = (this.isHost && this.state.winner && !this.state.finalWinner) ? "block" : "none";
        }
    }

    const game = new GameCore();

    function hostRoom() {
        const roomId = document.getElementById('room-id').value.trim();
        if (!roomId) return alert("部屋名を入力");
        game.isHost = true; game.peer = new Peer(roomId);
        game.peer.on('open', (id) => {
            game.myPeerId = id;
            game.state.players[id] = MAJORS[0].id;
            document.getElementById('room-display').textContent = "ID:" + id;
            document.getElementById('lobby-setup').style.display = 'none';
            document.getElementById('lobby-wait').style.display = 'block';
            document.getElementById('start-btn').style.display = 'block';
            updateLobby();
        });
        game.peer.on('connection', (conn) => {
            game.conns[conn.peer] = conn;
            conn.on('open', () => {
                const n = Object.keys(game.state.players).length;
                if (n < 5) game.state.players[conn.peer] = MAJORS[n].id;
                game.broadcast(); updateLobby();
            });
            conn.on('data', (d) => { if (d.type === 'action') game.applyAction(d.actorId, d.actType, d.targetIdx, d.amount); });
        });
        game.peer.on('error', (err) => { if (err.type === 'unavailable-id') alert("その部屋名はすでに使用されています。"); });
    }

    function joinRoom() {
        const roomId = document.getElementById('room-id').value.trim();
        if (!roomId) return alert("部屋名を入力");
        game.isHost = false; game.hostId = roomId; game.peer = new Peer();
        game.peer.on('open', (id) => {
            game.myPeerId = id; const conn = game.peer.connect(roomId);
            game.conns[roomId] = conn;
            conn.on('data', (d) => { if (d.type === 'sync') { game.state = d.state; game.updateUI(); updateLobby(); } });
            document.getElementById('lobby-setup').style.display = 'none';
            document.getElementById('lobby-wait').style.display = 'block';
        });
    }

    function updateLobby() {
        const list = document.getElementById('player-list');
        list.innerHTML = '<strong>参戦プレイヤー:</strong>';
        Object.entries(game.state.players).forEach(([pid, mid]) => {
            const d = document.createElement('div');
            d.textContent = `・${MAJORS.find(m => m.id === mid).name} (${pid === game.myPeerId ? 'あなた' : 'PL'})`;
            list.appendChild(d);
        });
    }
</script>
</body>
</html>
